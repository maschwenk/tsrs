[package]
name = "tsrs_execute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# The tsc driver (Go's internal/execute: tsc, tsc -b), as a library: the `tsrs` binary and the WebAssembly build
# (crates/tsrs_wasm) call it. It links no allocator, language server, API server or file watcher.
[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_vfs.workspace = true
tsrs_tsoptions.workspace = true
tsrs_compiler.workspace = true
tsrs_incremental.workspace = true
tsrs_contentmapper.workspace = true
tsrs_ipc.workspace = true
tsrs_fswatch = { path = "../tsrs_fswatch" }
rustc-hash.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
similar = "3"
tsrs_contentmappertest.workspace = true

[features]
alloc-profile = ["tsrs_core/alloc-profile"]

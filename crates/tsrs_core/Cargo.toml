[package]
name = "tsrs_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Atomic borrow checking for FrozenCell in release builds (always on with debug_assertions).
checked-cells = []
# Per-call-site arena allocation profile and a counting global allocator (src/alloc_profile.rs).
alloc-profile = ["dep:mimalloc"]

[dependencies]
bumpalo.workspace = true
rustc-hash.workspace = true
indexmap.workspace = true
bitflags.workspace = true
memchr.workspace = true
mimalloc = { version = "0.1.52", optional = true }

[package]
name = "tsrs_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Atomic borrow checking for FrozenCell in release builds (always on with debug_assertions).
checked-cells = []
# Per-call-site arena allocation profile and a counting global allocator (src/alloc_profile.rs).
alloc-profile = ["dep:mimalloc-safe"]
# Creation-site counters for checker objects (src/sitecount.rs).
site-counts = []
# Compatibility feature retained for old build commands. The Oxc allocator always uses native pointers.
compressed-ptrs = []
# Compatibility feature retained for old build commands. Native pointers are now the only representation.
plain-ptrs = []

[dependencies]
rustc-hash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
bitflags.workspace = true
memchr.workspace = true
oxc_allocator.workspace = true
mimalloc-safe = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

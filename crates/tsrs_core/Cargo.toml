[package]
name = "tsrs_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["compressed-ptrs"]
# Atomic borrow checking for FrozenCell in release builds (always on with debug_assertions).
checked-cells = []
# Per-call-site arena allocation profile and a counting global allocator (src/alloc_profile.rs).
alloc-profile = ["dep:mimalloc-safe"]
# Creation-site counters for checker objects (src/sitecount.rs).
site-counts = []
# `P<T>` as a 32-bit handle into one reserved address range (src/reserve.rs, notes/mem-pointer-compression.md), on
# unix targets (build.rs).
compressed-ptrs = []
# Keeps `P<T>` a plain reference even when `compressed-ptrs` is on (for comparisons: `--features tsrs_core/plain-ptrs`).
plain-ptrs = []
# The shared-graph research prototype (src/sharedgraph.rs, TSRS_SHARED_GRAPH=1). Without it every frozen-object test
# is a constant false and the prototype's read and write paths fold away.
shared-graph = []

[dependencies]
rustc-hash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
memchr.workspace = true
mimalloc-safe = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

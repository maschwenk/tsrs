[package]
name = "tsrs_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_ast.workspace = true
tsrs_vfs.workspace = true
tsrs_tsoptions.workspace = true
tsrs_compiler.workspace = true
rustc-hash.workspace = true
tsrs_lsp.workspace = true
tsrs_api.workspace = true
tsrs_api_transport.workspace = true
tsrs_execute = { path = "../tsrs_execute" }
# mimalloc v3, called directly by the global allocator in main.rs.
# no_thp avoids huge-page amplification on the heap (notes/mem-no-thp.md). It also disables THP for the
# whole process; main re-enables it for the arena.
libmimalloc-sys2 = { version = "0.1.63", features = ["v3", "no_thp"] }
libc = "0.2"
[features]
# Creation-site counters of checker objects, printed at exit (tsrs_core::sitecount).
site-counts = ["tsrs_compiler/site-counts"]
# TSRS_WORK_CENSUS=<file>: the work census (docs/DEBUGGING.md).
work-census = ["tsrs_compiler/work-census"]
# TOOL: TSRS_AST_SIZING=<file> counts the parsed syntax tree (notes/mem-compact-ast-sizing.md).
ast-sizing = ["tsrs_compiler/ast-sizing"]
# Allocation profile (tsrs_core/alloc-profile); replaces the mimalloc global allocator with the counting one.
alloc-profile = ["tsrs_execute/alloc-profile"]
# TSRS_ASSIGNMENT_STATS also attributes checker-created types/symbols to files (tsrs_compiler checkerpool_stats.rs).
assignment-stats = ["tsrs_compiler/assignment-stats"]
# The shared type graph (TSRS_SHARED_GRAPH=1; tsrs_core/shared-graph).
shared-graph = ["tsrs_core/shared-graph"]

[[bin]]
name = "tsrs"
path = "src/main.rs"

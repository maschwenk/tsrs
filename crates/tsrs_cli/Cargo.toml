[package]
name = "tsrs_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
tsrs_parser.workspace = true
tsrs_binder.workspace = true
tsrs_vfs.workspace = true
tsrs_module.workspace = true
tsrs_tsoptions.workspace = true
tsrs_compiler = { path = "../tsrs_compiler", default-features = false }
rustc-hash.workspace = true
tsrs_lsp.workspace = true
tsrs_project.workspace = true
tsrs_incremental.workspace = true
tsrs_api.workspace = true
tsrs_api_transport.workspace = true
# no_thp: mimalloc does not advise MADV_HUGEPAGE on its arenas (Linux). With the advice every 2 MiB block a thread
# touched is resident in full, and each thread's partly filled medium (512 KiB) and large (4 MiB) pages cost their
# whole block: on 64 vCPUs, vscode, -25% / -27% / -33% peak RSS at 4 / 16 / 64 checkers for +1-3.5% check time at
# 4-16 and +3-17% wall (parallel parse, exit); -9% at 4 checkers on 8 CPUs (notes/mem-thp.md). The tsrs arena keeps
# its own huge pages (tsrs_core::reserve). tools/perf/probe.sh rewrites the line below to build the comparison binary.
mimalloc = { version = "0.1.52", features = ["no_thp"] }
libc = "0.2"
[dev-dependencies]
similar = "3"

[features]
default = ["checker"]
checker = ["tsrs_compiler/checker"]
# Creation-site counters of checker objects, printed at exit (tsrs_core::sitecount).
site-counts = ["tsrs_compiler/site-counts"]
# TSRS_WORK_CENSUS=<file>: the work census (docs/DEBUGGING.md).
work-census = ["tsrs_compiler/work-census"]
# Allocation profile (tsrs_core/alloc-profile); replaces the mimalloc global allocator with the counting one.
alloc-profile = ["tsrs_core/alloc-profile"]
# TSRS_ASSIGNMENT_STATS also attributes checker-created types/symbols to files (tsrs_compiler checkerpool_stats.rs).
assignment-stats = ["tsrs_compiler/assignment-stats"]

[[bin]]
name = "tsrs"
path = "src/main.rs"

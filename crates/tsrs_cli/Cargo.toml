[package]
name = "tsrs_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
tsrs_parser.workspace = true
tsrs_binder.workspace = true
tsrs_vfs.workspace = true
tsrs_module.workspace = true
tsrs_tsoptions.workspace = true
tsrs_compiler = { path = "../tsrs_compiler", default-features = false }
rustc-hash.workspace = true
tsrs_lsp.workspace = true
tsrs_project.workspace = true
tsrs_incremental.workspace = true
tsrs_api.workspace = true
tsrs_api_transport.workspace = true
tsrs_execute = { path = "../tsrs_execute", default-features = false }
# no_thp: no MADV_HUGEPAGE on the mimalloc heap (huge-page amplification on Linux; see notes/mem-no-thp.md).
mimalloc = { version = "0.1.52", features = ["no_thp"] }
libc = "0.2"
[features]
default = ["checker"]
checker = ["tsrs_compiler/checker", "tsrs_execute/checker"]
# Creation-site counters of checker objects, printed at exit (tsrs_core::sitecount).
site-counts = ["tsrs_compiler/site-counts", "tsrs_execute/site-counts"]
# TSRS_WORK_CENSUS=<file>: the work census (docs/DEBUGGING.md).
work-census = ["tsrs_compiler/work-census", "tsrs_execute/work-census"]
xfile-stats = ["tsrs_compiler/xfile-stats", "tsrs_core/xfile-stats"]
# Allocation profile (tsrs_core/alloc-profile); replaces the mimalloc global allocator with the counting one.
alloc-profile = ["tsrs_core/alloc-profile", "tsrs_execute/alloc-profile"]
# TSRS_ASSIGNMENT_STATS also attributes checker-created types/symbols to files (tsrs_compiler checkerpool_stats.rs).
assignment-stats = ["tsrs_compiler/assignment-stats", "tsrs_execute/assignment-stats"]

[[bin]]
name = "tsrs"
path = "src/main.rs"

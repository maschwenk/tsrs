[package]
name = "tsrs_compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_sourcemap.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
tsrs_parser.workspace = true
tsrs_binder.workspace = true
tsrs_vfs.workspace = true
tsrs_module.workspace = true
tsrs_tsoptions.workspace = true
tsrs_modulespecifiers.workspace = true
tsrs_spanmap.workspace = true
tsrs_contentmapper.workspace = true
tsrs_checker.workspace = true
tsrs_declarations.workspace = true
tsrs_printer.workspace = true
tsrs_transformers.workspace = true
rustc-hash.workspace = true
rayon.workspace = true

[features]
# Creation-site counters of checker objects (tsrs_core::sitecount).
site-counts = ["tsrs_checker/site-counts"]
work-census = ["tsrs_checker/work-census"]
# TOOL: TSRS_AST_SIZING=<file> (tsrs_ast/ast-sizing, notes/mem-compact-ast-sizing.md).
ast-sizing = ["tsrs_ast/ast-sizing"]
# TSRS_ASSIGNMENT_STATS also attributes checker-created types/symbols to files.
assignment-stats = ["tsrs_checker/assignment-stats"]

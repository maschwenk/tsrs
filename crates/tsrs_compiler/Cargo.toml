[package]
name = "tsrs_compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
tsrs_parser.workspace = true
tsrs_binder.workspace = true
tsrs_vfs.workspace = true
tsrs_module.workspace = true
tsrs_tsoptions.workspace = true
tsrs_modulespecifiers.workspace = true
tsrs_checker = { workspace = true, optional = true }
tsrs_declarations = { workspace = true, optional = true }
rustc-hash.workspace = true
indexmap.workspace = true
bitflags.workspace = true
rayon.workspace = true

[features]
# The checker crate is being ported concurrently; without this feature the program still loads,
# parses and binds files (enough for --listFilesOnly), but has no type checker.
default = ["checker"]
checker = ["dep:tsrs_checker", "dep:tsrs_declarations"]
# Creation-site counters of checker objects (tsrs_core::sitecount).
site-counts = ["tsrs_checker?/site-counts"]
# TSRS_ASSIGNMENT_STATS also attributes checker-created types/symbols to files.
assignment-stats = ["checker", "tsrs_checker/assignment-stats"]

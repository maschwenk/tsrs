[package]
name = "tsrs_api_transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport layer for the tsgo-compatible programmatic API (--api): sync MessagePack tuples, async JSON-RPC, filesystem callbacks"

[lints]
workspace = true

[dependencies]
base64.workspace = true
tsrs_vfs.workspace = true
tsrs_core.workspace = true
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[lib]
doctest = false

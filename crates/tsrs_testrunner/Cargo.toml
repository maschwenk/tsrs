[package]
name = "tsrs_testrunner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# The Rust compiler backend. Off until tsrs_ast/tsrs_compiler build; the harness otherwise runs against
# Go-captured diagnostics (--oracle).
compiler = ["dep:tsrs_ast", "dep:tsrs_parser", "dep:tsrs_vfs", "dep:tsrs_tsoptions", "dep:tsrs_compiler"]

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
rustc-hash.workspace = true
tsrs_ast = { workspace = true, optional = true }
tsrs_parser = { workspace = true, optional = true }
tsrs_vfs = { workspace = true, optional = true }
tsrs_tsoptions = { workspace = true, optional = true }
tsrs_compiler = { workspace = true, optional = true }
regex = "1"
serde_json = "1"
similar = "2"

[[bin]]
name = "tsrs-test"
path = "src/main.rs"

[package]
name = "tsrs_testrunner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["compiler"]
# The complete Rust compiler backend (program creation, checking and emit).
compiler = ["tsoptions", "dep:tsrs_compiler", "dep:tsrs_contentmapper", "dep:tsrs_sourcemap", "dep:tsrs_scanner", "dep:tsrs_checker", "dep:tsrs_incremental"]
# Option declarations from tsrs_tsoptions (instead of the oracle's options.json).
tsoptions = ["dep:tsrs_tsoptions", "dep:tsrs_ast", "dep:tsrs_parser", "dep:tsrs_vfs"]
# Allocation profile (tsrs_core/alloc-profile); replaces the mimalloc global allocator with the counting one.
alloc-profile = ["tsrs_core/alloc-profile"]

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
rustc-hash.workspace = true
tsrs_ast = { workspace = true, optional = true }
tsrs_parser = { workspace = true, optional = true }
tsrs_vfs = { workspace = true, optional = true }
tsrs_tsoptions = { workspace = true, optional = true }
tsrs_compiler = { workspace = true, optional = true }
tsrs_contentmapper = { workspace = true, optional = true }
tsrs_checker = { workspace = true, optional = true }
tsrs_incremental = { workspace = true, optional = true }
tsrs_scanner = { workspace = true, optional = true }
tsrs_sourcemap = { workspace = true, optional = true }
regex = "1"
serde_json = "1"
similar = "3"
indexmap.workspace = true
mimalloc-safe.workspace = true

[[bin]]
name = "tsrs-test"
path = "src/main.rs"

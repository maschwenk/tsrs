[package]
name = "tsrs_parser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `cargo check --all-features` enables tsrs_core/alloc-profile, whose counting global allocator would collide with
# the one in examples/ast_oracle; the example steps aside when this feature is on.
alloc-profile = ["tsrs_core/alloc-profile"]

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
rustc-hash.workspace = true
bitflags.workspace = true

[dev-dependencies]
tsrs_vfs.workspace = true
mimalloc-safe.workspace = true

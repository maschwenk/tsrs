# Depot CI workflow (https://depot.dev/docs/ci/overview). Benchmarks tsrs against tsgo (typescript@7.0.2) on the
# typescript-benchmarking projects and four open-source applications (bench/README.md) and rewrites the table between
# the bench markers at the top of README.md. Not a GitHub Actions workflow: this repository is connected to Depot CI,
# and Depot's runners for GitHub Actions only serve organization-owned repositories.
#
# Four jobs (bench/README.md "CI"): `build` makes the PGO dist binary once; `measure` is one job per project of
# bench/projects.json, each on its own machine of the fixed spec, so the projects are measured at the same time
# without ever sharing a CPU (one job measuring them one after the other took 18-20 min; the longest project, vscode,
# takes about 5); `measure-wide` measures every project with `--checkers 16` on one 16-vCPU machine; `merge` joins
# the partial results into one result file (bench/run.py --merge), flags regressions and commits.
#
# Loop guards: the results commit only touches README.md and bench/results/** (excluded by `paths`), and carries
# [skip ci], which the build job's `if` also checks (the commit is pushed by Depot's GitHub app, which may trigger
# Depot CI); the other jobs need the build job, so they are skipped with it.

name: Bench

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!README.md"
      - "!bench/results/**"
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          commit to measure instead of the ref's head (backfill: a commit whose bench was skipped or cancelled);
          its results file is committed and README.md gets its table only if no newer commit's table is there
        default: ""

# One bench per push, never cancelled: the group is the commit, so a push during a run starts its own run (the
# measuring jobs never share a machine, so overlapping runs do not disturb each other) and only a re-dispatch of the
# same commit replaces a queued twin. Until 2026-10-07 the group was shared and a push replaced the queued bench, so
# bursts of merges left most commits without a results file (25 of 48 non-skip commits on 2026-10-06/07) and the
# regression flag could only name "one of N merges". The results commit and the README table handle overlapping
# runs: see the "Commit results" step.
concurrency:
  group: bench-${{ inputs.commit || github.sha }} # the measured commit, so backfills of different commits run side by side
  cancel-in-progress: false

permissions:
  contents: read

# Fixed machine spec so runs are comparable: Depot depot-ubuntu-24.04-8 = 8 vCPU / 32 GB / x86_64 (bench/README.md
# "CI"), for the build (PGO training) and for every measuring job except `measure-wide` (depot-ubuntu-24.04-16, 16
# vCPU). The hardware steps fail the job on any other machine; there is no fallback runner.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # tsrs is measured as released: the PGO build of the `dist` profile, optimized with BOLT, with the same commands as
  # the build job of .github/workflows/release.yml (target x86_64-unknown-linux-gnu) and the same training workloads
  # (.github/scripts/pgo-train.sh and .github/scripts/bolt.sh), which run on the xstate-main and webpack checkouts set
  # up here (bench/.work). The measuring jobs get the binary as the `tsrs-pgo-dist` artifact, with the `rustc -V` that
  # built it (results record the compiler; bench/regressions.py reads it).
  build:
    # Second loop guard: the results commit says [skip ci] (null on workflow_dispatch, which then runs).
    if: github.repository == 'maschwenk/tsrs' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit || github.sha }} # the measured commit (workflow_dispatch may name one)
          persist-credentials: false

      - name: Runner hardware (must match the fixed spec)
        run: |
          nproc; free -g; df -h / | tail -1
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          mem_gb=$(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo)
          if [ "$(nproc)" != 8 ] || [ "$mem_gb" -lt 28 ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::expected 8 vCPU / 32 GB / x86_64, got $(nproc) vCPU / ${mem_gb} GB / $(uname -m)"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The conformance suite (part of the PGO training workload) reads its tests from ts-ref/tsc/testdata.
      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      # The testdata checkout (~5 s) is cached per TypeScript commit; the sparse checkout below runs only on a miss.
      - name: Restore TypeScript testdata
        id: ts-ref
        uses: actions/cache/restore@v4
        with:
          path: ts-ref/tsc/testdata
          key: ts-ref-testdata-${{ steps.ts.outputs.commit }}

      - name: Check out TypeScript testdata
        if: steps.ts-ref.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false

      - name: Save TypeScript testdata
        if: steps.ts-ref.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ts-ref/tsc/testdata
          key: ${{ steps.ts-ref.outputs.cache-primary-key }}

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: llvm-tools
          save-cache: true
          cache-key: bench-pgo

      - name: Install x86_64-unknown-linux-gnu target
        run: rustup target add x86_64-unknown-linux-gnu

      # Caches ~/.cargo and the dependency part of target/, which holds only the instrumented build below: its
      # RUSTFLAGS are the same in every run, so its dependencies are reused. The final build's RUSTFLAGS contain the
      # profile's hash, which changes every run, so it is built outside target/ and not cached.
      # On Depot runners every cache action below is served by Depot Cache (no workflow changes needed). One cache for
      # the suite checkout + the npm compilers, and one per cloned project (checkout + node_modules) keyed on its pinned
      # commit and install command. This job needs the two training projects; each measuring job restores its own.
      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys --projects xstate-main,webpack | tee -a "$GITHUB_OUTPUT"

      - name: Restore suite and compilers
        id: cache-shared
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Restore xstate-main
        id: cache-xstate
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/xstate-main
          key: bench-xstate-main-${{ runner.os }}-${{ steps.keys.outputs['xstate-main'] }}

      - name: Restore webpack
        id: cache-webpack
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/webpack
          key: bench-webpack-${{ runner.os }}-${{ steps.keys.outputs['webpack'] }}

      # A no-op for everything restored above; installs the compilers and the two training projects otherwise.
      - name: Set up the training projects
        run: python3 bench/run.py --setup-only --projects xstate-main,webpack

      - name: Save suite and compilers
        if: steps.cache-shared.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: ${{ steps.cache-shared.outputs.cache-primary-key }}

      - name: Save xstate-main
        if: steps.cache-xstate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bench/.work/solutions/xstate-main
          key: ${{ steps.cache-xstate.outputs.cache-primary-key }}

      - name: Save webpack
        if: steps.cache-webpack.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bench/.work/solutions/webpack
          key: ${{ steps.cache-webpack.outputs.cache-primary-key }}

      - name: PGO instrumented build
        env:
          RUSTFLAGS: -Cprofile-generate=/tmp/tsrs-pgo/raw
          # The same as the final build's: profile settings are part of every symbol name, and the profile only
          # applies to functions whose names match (notes/perf-pgo.md, 2026-10-09).
          CARGO_PROFILE_DIST_STRIP: none
        run: cargo build --profile dist --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_fourslash --target x86_64-unknown-linux-gnu

      - name: PGO training run
        run: .github/scripts/pgo-train.sh target/x86_64-unknown-linux-gnu/dist /tmp/tsrs-pgo/raw bench/.work

      - name: PGO merge profiles
        id: profile
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -o /tmp/tsrs-pgo/merged.profdata /tmp/tsrs-pgo/raw/*.profraw
          "$profdata" show /tmp/tsrs-pgo/merged.profdata | tail -5
          sum=$(shasum -a 256 /tmp/tsrs-pgo/merged.profdata | cut -c1-16)
          mv /tmp/tsrs-pgo/merged.profdata "/tmp/tsrs-pgo/$sum.profdata"
          echo "path=/tmp/tsrs-pgo/$sum.profdata" >> "$GITHUB_OUTPUT"

      # --emit-relocs keeps the relocations BOLT needs to move code (release.yml's Linux builds link the same way).
      - name: Build tsrs (PGO, dist profile)
        env:
          RUSTFLAGS: -Cprofile-use=${{ steps.profile.outputs.path }} -Clink-arg=-Wl,--emit-relocs
          CARGO_TARGET_DIR: /tmp/tsrs-pgo/target
          # BOLT needs the input binary's symbols; bolt.sh strips its final output. The instrumented build sets the same.
          CARGO_PROFILE_DIST_STRIP: none
        run: cargo build --profile dist --locked -p tsrs_cli --target x86_64-unknown-linux-gnu

      # BOLT as in release.yml: the LLVM release that matches rustc's LLVM, then bolt.sh for tsrs alone (instrument,
      # train on xstate-main and webpack, optimize, byte-compare the output with the input binary's). The suite gates
      # on the BOLT-optimized tsrs-test and tsrs-fourslash stay in release.yml.
      - name: Install BOLT
        run: |
          llvm=$(rustc -vV | sed -n 's/^LLVM version: //p')
          name="LLVM-$llvm-Linux-X64"
          mkdir -p /tmp/llvm
          for attempt in 1 2 3; do
            curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm/$name.tar.zst" |
              tar -x --zstd -C /tmp/llvm --strip-components=1 --wildcards \
                "$name/bin/llvm-bolt" "$name/bin/merge-fdata" "$name/lib/libbolt_rt_instr.a" && break
            sleep $((attempt * 10))
          done
          echo /tmp/llvm/bin >> "$GITHUB_PATH"

      - name: BOLT
        env:
          BOLT_TSRS_ONLY: "1"
        run: .github/scripts/bolt.sh /tmp/tsrs-pgo/target/x86_64-unknown-linux-gnu/dist /tmp/tsrs-pgo/bolt bench/.work

      # The checksum is printed here and in every measuring job, so the logs show that they measured this binary.
      - name: Package the binary for the measuring jobs
        run: |
          mkdir -p /tmp/tsrs-pgo/dist
          cp /tmp/tsrs-pgo/target/x86_64-unknown-linux-gnu/dist/tsrs /tmp/tsrs-pgo/dist/tsrs
          rustc -V > /tmp/tsrs-pgo/dist/rustc.txt
          sha256sum /tmp/tsrs-pgo/dist/tsrs
          /tmp/tsrs-pgo/dist/tsrs --version
          cat /tmp/tsrs-pgo/dist/rustc.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tsrs-pgo-dist
          path: /tmp/tsrs-pgo/dist
          if-no-files-found: error
          retention-days: 3

      # The measuring matrix: every project of bench/projects.json, so a new project gets a job without a workflow change.
      - name: Projects to measure
        id: plan
        run: echo "projects=$(python3 bench/run.py --print-projects)" >> "$GITHUB_OUTPUT"

  # One project per job, each on an idle machine of the fixed spec: the measurement is what it was in the sequential
  # run (one project at a time, nothing else running), only the projects no longer wait for each other.
  measure:
    needs: build
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60 # a warm run takes a few minutes; a cold project cache adds its clone and install
    strategy:
      fail-fast: false # one project's failure must not cancel the others; the merge job then waits for a re-run
      matrix:
        project: ${{ fromJSON(needs.build.outputs.projects) }}
    env:
      BENCH_RUNNER: Depot CI `depot-ubuntu-24.04-8`
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit || github.sha }} # the measured commit (workflow_dispatch may name one)
          persist-credentials: false

      - name: Runner hardware (must match the fixed spec)
        run: |
          nproc; free -g; df -h / | tail -1
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          mem_gb=$(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo)
          if [ "$(nproc)" != 8 ] || [ "$mem_gb" -lt 28 ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::expected 8 vCPU / 32 GB / x86_64, got $(nproc) vCPU / ${mem_gb} GB / $(uname -m)"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # `shared` is the suite + compilers cache; `project` is this project's (none for the two suite-only projects,
      # Compiler and Compiler-Unions, which live in the suite checkout).
      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys --projects "$PROJECT" | sed "s/^$PROJECT=/project=/" | tee -a "$GITHUB_OUTPUT"

      # Saved by the build job (restore only; a miss installs the compilers again, ~30 s).
      - name: Restore suite and compilers
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Restore ${{ matrix.project }}
        if: steps.keys.outputs.project != ''
        id: cache-project
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/${{ matrix.project }}
          key: bench-${{ matrix.project }}-${{ runner.os }}-${{ steps.keys.outputs.project }}

      # A no-op when the caches hit; clones and installs the project otherwise (and installs the reference compiler).
      - name: Set up ${{ matrix.project }}
        run: python3 bench/run.py --setup-only --projects "$PROJECT"

      - name: Save ${{ matrix.project }}
        if: steps.keys.outputs.project != '' && steps.cache-project.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bench/.work/solutions/${{ matrix.project }}
          key: ${{ steps.cache-project.outputs.cache-primary-key }}

      - name: Download tsrs (PGO, dist profile)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tsrs-pgo-dist
          path: /tmp/tsrs-pgo/dist

      # Artifacts drop the executable bit. The checksum must be the one the build job printed.
      - name: Check the binary
        run: |
          chmod +x /tmp/tsrs-pgo/dist/tsrs
          sha256sum /tmp/tsrs-pgo/dist/tsrs
          /tmp/tsrs-pgo/dist/tsrs --version
          cat /tmp/tsrs-pgo/dist/rustc.txt

      - name: Benchmark ${{ matrix.project }}
        run: >-
          python3 bench/run.py --projects "$PROJECT" --tsrs /tmp/tsrs-pgo/dist/tsrs --tsrs-build pgo-dist
          --rustc "$(cat /tmp/tsrs-pgo/dist/rustc.txt)" --out-dir "/tmp/bench-partial/$PROJECT" --reps 5 --tsgo-reps 3

      - name: Upload the result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-partial-${{ matrix.project }}
          path: /tmp/bench-partial/${{ matrix.project }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-logs-${{ matrix.project }}
          path: bench/.work/logs
          if-no-files-found: ignore

  # The 16-vCPU machine's tables: every project in one job, in default mode (`wide`: each compiler at its own thread
  # count, which is the README table) and at `--checkers 16` (16 checker threads would oversubscribe the fixed-spec
  # machine), each with `bun check` from Bun canary as a third column. It runs while the fixed-spec jobs do; it is the
  # run's only 16-vCPU job. Its cells record their machine (bench/run.py --merge). The regression flag never reads them:
  # it compares the single-threaded counts of the fixed-spec jobs.
  measure-wide:
    needs: build
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    env:
      BENCH_RUNNER: Depot CI `depot-ubuntu-24.04-16`
      PROJECTS: ${{ join(fromJSON(needs.build.outputs.projects), ',') }}
      BUN_VERSION: canary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit || github.sha }} # the measured commit (workflow_dispatch may name one)
          persist-credentials: false

      - name: Runner hardware (16 vCPU x86_64)
        run: |
          nproc; free -g; df -h / | tail -1
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          if [ "$(nproc)" != 16 ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::expected 16 vCPU x86_64, got $(nproc) vCPU $(uname -m)"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys --projects "$PROJECTS" | tee -a "$GITHUB_OUTPUT"

      # Restore only: the fixed-spec jobs save these. A project added to bench/projects.json needs a step here too;
      # without one it is cloned and installed by every run of this job.
      - name: Restore suite and compilers
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Restore vscode
        if: steps.keys.outputs['vscode'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/vscode
          key: bench-vscode-${{ runner.os }}-${{ steps.keys.outputs['vscode'] }}

      - name: Restore xstate-main
        if: steps.keys.outputs['xstate-main'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/xstate-main
          key: bench-xstate-main-${{ runner.os }}-${{ steps.keys.outputs['xstate-main'] }}

      - name: Restore webpack
        if: steps.keys.outputs['webpack'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/webpack
          key: bench-webpack-${{ runner.os }}-${{ steps.keys.outputs['webpack'] }}

      - name: Restore mui-docs
        if: steps.keys.outputs['mui-docs'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/mui-docs
          key: bench-mui-docs-${{ runner.os }}-${{ steps.keys.outputs['mui-docs'] }}

      - name: Restore cal-diy
        if: steps.keys.outputs['cal-diy'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/cal-diy
          key: bench-cal-diy-${{ runner.os }}-${{ steps.keys.outputs['cal-diy'] }}

      - name: Restore formbricks-web
        if: steps.keys.outputs['formbricks-web'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/formbricks-web
          key: bench-formbricks-web-${{ runner.os }}-${{ steps.keys.outputs['formbricks-web'] }}

      - name: Restore supabase-studio
        if: steps.keys.outputs['supabase-studio'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/supabase-studio
          key: bench-supabase-studio-${{ runner.os }}-${{ steps.keys.outputs['supabase-studio'] }}

      - name: Restore t3code-server
        if: steps.keys.outputs['t3code-server'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/t3code-server
          key: bench-t3code-server-${{ runner.os }}-${{ steps.keys.outputs['t3code-server'] }}

      - name: Restore mikro-orm
        if: steps.keys.outputs['mikro-orm'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/mikro-orm
          key: bench-mikro-orm-${{ runner.os }}-${{ steps.keys.outputs['mikro-orm'] }}

      - name: Restore next-packages-next
        if: steps.keys.outputs['next-packages-next'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/next-packages-next
          key: bench-next-packages-next-${{ runner.os }}-${{ steps.keys.outputs['next-packages-next'] }}

      - name: Restore next-root
        if: steps.keys.outputs['next-root'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/next-root
          key: bench-next-root-${{ runner.os }}-${{ steps.keys.outputs['next-root'] }}

      - name: Restore storybook
        if: steps.keys.outputs['storybook'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/storybook
          key: bench-storybook-${{ runner.os }}-${{ steps.keys.outputs['storybook'] }}

      - name: Restore nuxt
        if: steps.keys.outputs['nuxt'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/nuxt
          key: bench-nuxt-${{ runner.os }}-${{ steps.keys.outputs['nuxt'] }}

      - name: Restore playwright
        if: steps.keys.outputs['playwright'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/playwright
          key: bench-playwright-${{ runner.os }}-${{ steps.keys.outputs['playwright'] }}

      - name: Restore drizzle-orm
        if: steps.keys.outputs['drizzle-orm'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/drizzle-orm
          key: bench-drizzle-orm-${{ runner.os }}-${{ steps.keys.outputs['drizzle-orm'] }}

      - name: Set up the projects
        run: python3 bench/run.py --setup-only --projects "$PROJECTS"

      # `bun check` needs Bun 1.4.3 or later; canary until that is a release (as in bench-compare.yml).
      - name: Install Bun (${{ env.BUN_VERSION }})
        run: |
          tag=$([ "$BUN_VERSION" = canary ] && echo canary || echo "bun-v$BUN_VERSION")
          for attempt in 1 2 3; do
            curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/$tag/bun-linux-x64.zip" && break
            sleep $((attempt * 10))
          done
          unzip -oq /tmp/bun.zip -d /tmp/bun
          /tmp/bun/bun-linux-x64/bun --revision
          /tmp/bun/bun-linux-x64/bun check --help | head -3

      - name: Download tsrs (PGO, dist profile)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tsrs-pgo-dist
          path: /tmp/tsrs-pgo/dist

      # Artifacts drop the executable bit. The checksum must be the one the build job printed.
      - name: Check the binary
        run: |
          chmod +x /tmp/tsrs-pgo/dist/tsrs
          sha256sum /tmp/tsrs-pgo/dist/tsrs
          /tmp/tsrs-pgo/dist/tsrs --version
          cat /tmp/tsrs-pgo/dist/rustc.txt

      - name: Benchmark (default mode and --checkers 16, with bun check)
        run: |
          # Old backfilled commits lack checkers16; measure their default mode on the actual 16-vCPU runner.
          modes=$(python3 -c 'import sys; sys.path.insert(0, "bench"); import run; print("wide,checkers16" if "checkers16" in run.MODE_FLAGS else "wide")')
          python3 bench/run.py --projects "$PROJECTS" --modes "$modes" --tsrs /tmp/tsrs-pgo/dist/tsrs \
            --tsrs-build pgo-dist --rustc "$(cat /tmp/tsrs-pgo/dist/rustc.txt)" --bun /tmp/bun/bun-linux-x64/bun \
            --out-dir /tmp/bench-partial/wide --reps 10 --tsgo-reps 3

      - name: Upload the result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-partial-wide
          path: /tmp/bench-partial/wide
          if-no-files-found: error
          retention-days: 3

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-logs-wide
          path: bench/.work/logs
          if-no-files-found: ignore

  # Joins the per-project results into bench/results/<date>-<commit>.{json,md} and the README table, flags
  # regressions, and commits. Runs only when every fixed-spec measuring job succeeded: the regression flag reads them.
  # README.md shows one table, the 16-vCPU machine's default mode (`wide`, with bun check); bench/results/<...>.md has
  # every mode. If the wide job failed or was cancelled, the results file has no 16-vCPU sections and the README table
  # is left as it was.
  merge:
    needs: [build, measure, measure-wide]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.measure.result == 'success' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # pushes the results commit
      pull-requests: write # comments on pull requests that regress instruction counts (bench/regressions.py)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history: regressions.py lists the merges since the previous run; the results commit goes on the latest main

      - name: Download the per-project results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bench-partial-*
          path: /tmp/bench-partials

      - name: Merge results
        run: |
          echo "ref=$GITHUB_REF event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA"
          ls -R /tmp/bench-partials
          python3 bench/run.py --merge /tmp/bench-partials/*/*.json --out-dir /tmp/bench-merged --readme-modes wide --readme-table /tmp/bench-readme.md
          cp /tmp/bench-merged/* bench/results/
          # The README table needs the wide job's cells; without them --readme-table holds an empty table.
          if ! grep -q '^| ' /tmp/bench-readme.md; then echo "::warning::no 16-vCPU results; README.md keeps its table"; rm /tmp/bench-readme.md; fi

      - name: Upload the merged result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-result
          path: /tmp/bench-merged

      # Only a bench of a commit on main, measured without local changes, is published (the results commit and the
      # regression comments). A run started from a branch or a dirty worktree (`depot ci run --workflow
      # .depot/workflows/bench.yml`, which applies the local diff on the runner) ends with the `bench-result` artifact.
      - name: Decide whether to publish
        id: publish
        run: |
          git fetch -q origin main
          read -r commit dirty < <(python3 -c 'import json, sys; t = json.load(open(sys.argv[1]))["tsrs"]; print(t["commit"], t["dirty"])' /tmp/bench-merged/*.json)
          if [ "$dirty" = False ] && git merge-base --is-ancestor "$commit" origin/main; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::not publishing: $commit (dirty: $dirty) is not a clean commit on main; the result is the bench-result artifact"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Flag only (bench/README.md "Regression flag"): compares tsrs instruction counts and peak memory with the previous
      # run and, on a regression, comments on the pull requests merged in between. Never fails the job.
      - name: Flag bench regressions
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # This run's result (copied into bench/results by "Merge results"), not the newest file by date: runs of
        # different commits overlap and finish in any order. regressions.py compares it with the nearest earlier
        # benchmarked ancestor of its commit.
        run: python3 bench/regressions.py "bench/results/$(basename /tmp/bench-merged/*.json)" ${{ steps.publish.outputs.publish == 'true' && '--comment' || '' }}

      - name: Commit results
        if: steps.publish.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The measured commit: the ref's head on a push, the `commit` input on a backfill dispatch.
          measured=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["tsrs"]["commit"])' /tmp/bench-merged/*.json)
          measured=$(git rev-parse --verify "$measured^{commit}")
          # The results commit is re-created on top of the latest main instead of rebased: README.md is edited by
          # people while a bench runs, and rebasing the table commit over such edits conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            cp /tmp/bench-merged/* bench/results/
            # README.md keeps the newest commit's table. Runs overlap, so a run of an older commit can finish after
            # a descendant's run has published: then it adds its results file and leaves the table alone. The
            # commit a table came from is in its last line ("tsrs commit: `<sha>`", bench/run.py).
            readme_commit=$(sed -n 's/.*tsrs commit: `\([0-9a-f]\{7,40\}\)`.*/\1/p' README.md | head -1)
            if [ ! -f /tmp/bench-readme.md ]; then
              echo "::notice::no 16-vCPU table for ${measured::12}; README.md keeps its table"
            elif [ -n "$readme_commit" ] && [ "$readme_commit" != "${measured::12}" ] \
                && git cat-file -e "$readme_commit^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$measured" "$readme_commit"; then
              echo "::notice::README.md keeps the table of $readme_commit, a descendant of ${measured::12}; this run's table is bench/results/$(basename /tmp/bench-merged/*.md)"
            else
              python3 bench/run.py --apply-table /tmp/bench-readme.md --readme README.md
            fi
            git add README.md bench/results
            git commit -q -m "bench: results for ${measured::12} [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

# Depot CI workflow: one-off performance probe on a 32-vCPU machine (or the `runner` input's, such as the 8-vCPU
# `depot-ubuntu-24.04-8` of the README bench), for hill-climbing experiments that need more cores than a laptop, or
# Linux (notes/perf-*.md). Not scheduled and not triggered by pushes: run it from a branch or a dirty
# worktree with
#
#   depot ci run --workflow .depot/workflows/perf-probe.yml
#
# which uploads the local diff against origin/main and applies it on the runner, so the probe script and any tsrs
# change under test need not be pushed. Builds `cargo build --release -p tsrs_cli` (not the PGO dist build: relative
# comparisons only; confirm wins with bench-compare.yml), sets up the bench projects named in PROBE_PROJECTS, downloads
# Bun canary and tsgo, then runs tools/perf/probe.sh, which writes everything it wants to keep to probe-out/. That
# directory is the `perf-probe` artifact (depot ci artifacts list <run>; depot ci artifacts download <id>).
# actions/cache is not available to `depot ci run` (API-triggered runs are not tied to a ref), so every run clones and
# installs its projects (vscode: ~2 min) and builds from scratch (~4 min on 64 cores). A run of a pushed branch with
#
#   depot ci dispatch --repo maschwenk/tsrs --workflow perf-probe.yml --ref <branch> --input runner=depot-ubuntu-24.04-8 \
#     --input projects=vscode,formbricks-web --input script=tools/perf/leafprobe.sh --input probe_args='--reps 5'
#
# For an explicit 64-vCPU scaling experiment, pass --input runner=depot-ubuntu-24.04-64.
# This restores the projects from bench.yml's caches. `script` picks the probe (it gets `probe_args` as PROBE_ARGS).

name: Perf probe

on:
  workflow_dispatch:
    inputs:
      projects:
        description: comma-separated bench/projects.json names to set up
        default: vscode
      runner:
        description: Depot runner label
        default: depot-ubuntu-24.04-32
      script:
        description: probe script to run with bash
        default: tools/perf/probe.sh
      probe_args:
        description: passed to the probe script as PROBE_ARGS
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROBE_PROJECTS: ${{ inputs.projects || 'vscode' }}

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'depot-ubuntu-24.04-32' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Runner hardware
        run: |
          nproc; free -g; uname -r
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Socket|NUMA' || true
          mkdir -p probe-out
          { nproc; lscpu; free -g; } > probe-out/machine.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Set up pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Install Bun canary and perf
        run: |
          sudo apt-get install -y -qq strace >/dev/null 2>&1 || echo "strace not installed"
          curl -fsSL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/canary/bun-linux-x64.zip
          unzip -oq /tmp/bun.zip -d /tmp/bun
          /tmp/bun/bun-linux-x64/bun --revision
          # linux perf is best-effort: the packaged tools may not match the runner kernel.
          (sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null 2>&1 \
            && ls /usr/lib/linux-tools/*/perf) || echo "perf not installed"
          sudo sysctl -q -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: llvm-tools
          save-cache: true
          cache-key: perf-probe-${{ inputs.runner || 'depot-ubuntu-24.04-32' }}

      - name: Install x86_64-unknown-linux-gnu target
        run: rustup target add x86_64-unknown-linux-gnu

      # bench.yml's caches (restore only; dispatched runs of a pushed branch get them, `depot ci run` does not).
      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys --projects "$PROBE_PROJECTS" | tee -a "$GITHUB_OUTPUT"

      - name: Restore suite and compilers
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Restore vscode
        if: steps.keys.outputs['vscode'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/vscode
          key: bench-vscode-${{ runner.os }}-${{ steps.keys.outputs['vscode'] }}

      - name: Restore formbricks-web
        if: steps.keys.outputs['formbricks-web'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/formbricks-web
          key: bench-formbricks-web-${{ runner.os }}-${{ steps.keys.outputs['formbricks-web'] }}

      - name: Restore xstate-main
        if: steps.keys.outputs['xstate-main'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/xstate-main
          key: bench-xstate-main-${{ runner.os }}-${{ steps.keys.outputs['xstate-main'] }}

      - name: Restore supabase-studio
        if: steps.keys.outputs['supabase-studio'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/supabase-studio
          key: bench-supabase-studio-${{ runner.os }}-${{ steps.keys.outputs['supabase-studio'] }}

      - name: Restore t3code-server
        if: steps.keys.outputs['t3code-server'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/t3code-server
          key: bench-t3code-server-${{ runner.os }}-${{ steps.keys.outputs['t3code-server'] }}

      - name: Set up projects and compilers
        run: python3 bench/run.py --setup-only --projects "$PROBE_PROJECTS"

      - name: Build tsrs (release)
        run: cargo build --release --locked -p tsrs_cli

      - name: Probe
        env:
          TSRS_BIN: ${{ github.workspace }}/target/release/tsrs
          BUN_BIN: /tmp/bun/bun-linux-x64/bun
          BENCH_WORK: ${{ github.workspace }}/bench/.work
          PROBE_OUT: ${{ github.workspace }}/probe-out
          PROBE_ARGS: ${{ inputs.probe_args || '' }}
          PROBE_SCRIPT: ${{ inputs.script || 'tools/perf/probe.sh' }}
        run: bash "$PROBE_SCRIPT"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-probe
          path: probe-out
          if-no-files-found: warn

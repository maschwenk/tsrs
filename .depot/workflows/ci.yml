# Depot CI workflow (https://depot.dev/docs/ci/overview); Depot CI has no macOS sandboxes, so the macOS jobs stay in
# .github/workflows/. Security: read-only token, no secrets. Runs only on pushes to main and manual dispatch by
# collaborators; pull requests do not trigger CI.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pull-request runs are cancelled; every push to main runs to completion (several agents push to main).
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-and-test:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      # The conformance tests and the tsoptions unit tests read the reference baselines from ts-ref/tsc/testdata.
      - name: Check out TypeScript testdata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check
        run: cargo check --workspace --locked
        env:
          RUSTFLAGS: -D warnings

      - name: cargo test (fast crates)
        run: >-
          cargo test --locked --no-fail-fast
          -p tsrs_core -p tsrs_ast -p tsrs_scanner -p tsrs_diagnostics -p tsrs_vfs -p tsrs_module
          -p tsrs_tsoptions -p tsrs_printer -p tsrs_modulespecifiers -p tsrs_compiler -p tsrs_testrunner

      - name: Build release binaries
        run: cargo build --release --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_fourslash

      - name: Conformance suite
        run: .github/scripts/conformance-gate.sh

      - name: Fourslash (language service) suite
        run: .github/scripts/fourslash-gate.sh

      # Node 24 matches release.yml; the build-only TypeScript compiler in npm/package.json needs >=16.20.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # npm/build.mjs compiles the unstable/* JS API with npm/package.json's build-only tools when that manifest
      # exists; branches without it have nothing to install.
      - name: npm packaging smoke test
        run: |
          if [ -f npm/package-lock.json ]; then npm ci --prefix npm --no-audit --no-fund; fi
          node npm/build.mjs --binary x86_64-unknown-linux-gnu=target/release/tsrs --pack
          dir=$(mktemp -d)
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/npm/dist/*.tgz
          npx tsrs --version
          printf 'const x: number = 1;\n' > ok.ts
          npx tsrs ok.ts
          printf 'const x: number = "no";\n' > bad.ts
          if npx tsrs bad.ts; then echo "expected a type error"; exit 1; fi

      - name: Upload conformance results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-results
          path: target/test-results/*.txt
          if-no-files-found: ignore

  # docs/RUST.md: clippy findings per (lint, file) may not grow past tools/lint/baseline.tsv. A separate job because
  # it needs the clippy version pinned in tools/lint/ratchet.py, not the stable toolchain the build uses.
  lint-ratchet:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the pinned lint toolchain
        id: pin
        run: echo "toolchain=$(sed -n 's/^TOOLCHAIN = "\(.*\)"$/\1/p' tools/lint/ratchet.py)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-ratchet

      - name: Lint ratchet
        run: python3 tools/lint/ratchet.py --self-test && python3 tools/lint/ratchet.py

  # tools/gen-check.sh: re-runs the code generators and fails if a generated file differs from its generator's output
  # (docs/RUST.md, "Generated-code freshness check").
  generated-code:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Node 24 runs the .ts generators directly (type stripping).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      # The generators read ast.json and the Go sources; the fourslash generator also builds the Go packages.
      - name: Check out TypeScript (generator inputs)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/scripts/tsc/
            /tsc/
            !/tsc/testdata/
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - name: Generated code is up to date
        run: tools/gen-check.sh

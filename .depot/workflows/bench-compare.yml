# Manual head-to-head comparison on a selected Depot runner. Use 16 or 32 vCPU for everyday comparisons;
# 64 vCPU is opt-in for server scaling experiments. Results record the actual hardware.

name: Bench (head-to-head)

on:
  workflow_dispatch:
    inputs:
      cpus:
        description: Depot vCPU count (64 is for explicit server scaling experiments)
        type: choice
        options: ["16", "32", "64"]
        default: "16"
      projects:
        description: comma-separated bench/projects.json names
        default: vscode
      reps:
        description: timed runs per cell
        default: "20"
      threads:
        description: comma-separated thread settings (default, a number, all)
        default: default,4,8,16,all
      bun_version:
        description: Bun release tag (canary, or a version such as 1.4.3)
        default: canary

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROJECTS: ${{ inputs.projects || 'vscode' }}
  REPS: ${{ inputs.reps || '20' }}
  THREADS: ${{ inputs.threads || 'default,4,8,16,all' }}
  RUNNER_CPUS: ${{ inputs.cpus || '16' }}
  BUN_VERSION: ${{ inputs.bun_version || 'canary' }}

jobs:
  compare:
    runs-on: ${{ format('depot-ubuntu-24.04-{0}', inputs.cpus || '16') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Runner hardware
        run: |
          nproc; free -g; df -h / | tail -1
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Socket' || true
          if [ "$(nproc)" != "$RUNNER_CPUS" ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::expected $RUNNER_CPUS vCPU x86_64, got $(nproc) vCPU $(uname -m)"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
          run_install: false

      - name: Install Bun (${{ env.BUN_VERSION }})
        run: |
          tag=$([ "$BUN_VERSION" = canary ] && echo canary || echo "bun-v$BUN_VERSION")
          for attempt in 1 2 3; do
            curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/$tag/bun-linux-x64.zip" && break
            sleep $((attempt * 10))
          done
          unzip -oq /tmp/bun.zip -d /tmp/bun
          /tmp/bun/bun-linux-x64/bun --revision
          /tmp/bun/bun-linux-x64/bun check --help | head -3

      # The conformance suite (part of the PGO training workload) reads its tests from ts-ref/tsc/testdata.
      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out TypeScript testdata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: llvm-tools
          save-cache: true
          cache-key: bench-pgo

      - name: Install x86_64-unknown-linux-gnu target
        run: rustup target add x86_64-unknown-linux-gnu

      # Same cache keys as bench.yml, so the project checkouts it saved are reused (restore only).
      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys | tee -a "$GITHUB_OUTPUT"

      - name: Restore suite and compilers
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Restore vscode
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/vscode
          key: bench-vscode-${{ runner.os }}-${{ steps.keys.outputs['vscode'] }}

      - name: Restore xstate-main
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/xstate-main
          key: bench-xstate-main-${{ runner.os }}-${{ steps.keys.outputs['xstate-main'] }}

      - name: Restore webpack
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/webpack
          key: bench-webpack-${{ runner.os }}-${{ steps.keys.outputs['webpack'] }}

      - name: Restore mikro-orm
        if: steps.keys.outputs['mikro-orm'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/mikro-orm
          key: bench-mikro-orm-${{ runner.os }}-${{ steps.keys.outputs['mikro-orm'] }}

      - name: Restore next-packages-next
        if: steps.keys.outputs['next-packages-next'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/next-packages-next
          key: bench-next-packages-next-${{ runner.os }}-${{ steps.keys.outputs['next-packages-next'] }}

      - name: Restore next-root
        if: steps.keys.outputs['next-root'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/next-root
          key: bench-next-root-${{ runner.os }}-${{ steps.keys.outputs['next-root'] }}

      - name: Restore storybook
        if: steps.keys.outputs['storybook'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/storybook
          key: bench-storybook-${{ runner.os }}-${{ steps.keys.outputs['storybook'] }}

      - name: Restore nuxt
        if: steps.keys.outputs['nuxt'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/nuxt
          key: bench-nuxt-${{ runner.os }}-${{ steps.keys.outputs['nuxt'] }}

      - name: Restore playwright
        if: steps.keys.outputs['playwright'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/playwright
          key: bench-playwright-${{ runner.os }}-${{ steps.keys.outputs['playwright'] }}

      - name: Restore drizzle-orm
        if: steps.keys.outputs['drizzle-orm'] != ''
        uses: actions/cache/restore@v4
        with:
          path: bench/.work/solutions/drizzle-orm
          key: bench-drizzle-orm-${{ runner.os }}-${{ steps.keys.outputs['drizzle-orm'] }}

      # Also installs the 7.1-dev reference nightly. Cache-miss projects are set up by compare.py.
      - name: Set up benchmark projects
        run: python3 bench/run.py --setup-only --projects vscode,xstate-main,webpack

      # tsrs as a PGO `dist` build with the release workflow's PGO commands and training, without the BOLT step of
      # release.yml and bench.yml.
      - name: PGO instrumented build
        env:
          RUSTFLAGS: -Cprofile-generate=/tmp/tsrs-pgo/raw
        run: cargo build --profile dist --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_fourslash --target x86_64-unknown-linux-gnu

      - name: PGO training run
        run: .github/scripts/pgo-train.sh target/x86_64-unknown-linux-gnu/dist /tmp/tsrs-pgo/raw bench/.work

      - name: PGO merge profiles
        id: profile
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -o /tmp/tsrs-pgo/merged.profdata /tmp/tsrs-pgo/raw/*.profraw
          echo "path=/tmp/tsrs-pgo/merged.profdata" >> "$GITHUB_OUTPUT"

      - name: Build tsrs (PGO, dist profile)
        env:
          RUSTFLAGS: -Cprofile-use=${{ steps.profile.outputs.path }}
          CARGO_TARGET_DIR: /tmp/tsrs-pgo/target
        run: cargo build --profile dist --locked -p tsrs_cli --target x86_64-unknown-linux-gnu

      - name: Benchmark
        env:
          BENCH_RUNNER: Depot CI `depot-ubuntu-24.04-${{ inputs.cpus || '16' }}`
        run: >-
          python3 bench/compare.py --tsrs /tmp/tsrs-pgo/target/x86_64-unknown-linux-gnu/dist/tsrs
          --bun /tmp/bun/bun-linux-x64/bun --projects "$PROJECTS" --reps "$REPS" --threads "$THREADS"

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-compare
          path: |
            bench/results/compare
            bench/.work/logs
          if-no-files-found: ignore

  <title id="title">Performance</title>
  <desc id="description">VS Code (microsoft/vscode · src): 10,427 files loaded by tsrs. Time: TypeScript 7 6.53 s; tsrs 0.83 s; 7.9× faster. Peak memory: TypeScript 7 9.32 GiB; tsrs 2.09 GiB; 78% less. Machine: Depot CI depot-ubuntu-24.04-16 (16 vCPU, 63 GB RAM, Linux x86_64, AMD EPYC 9R45 96-Core Processor). T3 Code (pingdotgg/t3code · apps/server): 2,945 files loaded by tsrs. Heavy use of Effect and Zod. Time: TypeScript 7 14.51 s; tsrs 1.37 s; 10.6× faster. Peak memory: TypeScript 7 10.90 GiB; tsrs 2.11 GiB; 81% less. Machine: Depot CI depot-ubuntu-24.04-16 (16 vCPU, 63 GB RAM, Linux x86_64, AMD EPYC 9R45 96-Core Processor). MUI docs (mui/material-ui · docs): 16,766 files loaded by tsrs. Time: TypeScript 7 12.40 s; tsrs 0.78 s; 15.9× faster. Peak memory: TypeScript 7 13.71 GiB; tsrs 1.60 GiB; 88% less. Machine: Depot CI depot-ubuntu-24.04-16 (16 vCPU, 63 GB RAM, Linux x86_64, AMD EPYC 9R45 96-Core Processor). Lower is better. Median of 10 interleaved runs (3 for tsgo), both compilers with --checkers 16 on 16 vCPUs. tsrs uses PGO-optimized dist build, built like the npm release binaries. File counts include libraries and dependencies. Shared bar scales: time 0–16 seconds, memory 0–14 GiB. Failed or unavailable measurements are marked n/a. Measured 2026-10-15 15:23 UTC; tsrs commit 2d9cdf042fdfec7c292d362ebb23ac00a9b21c8c. TypeScript 7.0.2; TypeScript reference b85298b6a81f772d080b0455de0ca9d744cd6fd6.</desc>

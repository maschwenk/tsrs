# CodSpeed benchmarks (.github/workflows/codspeed.yml). Paths are the bench/run.py
# checkouts; the workflow's PROJECTS lists the same projects.
$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json
options:
  working-directory: .. # commands run in the config file's directory unless set
benchmarks:
  - name: Compiler-Unions
    exec: bench/codspeed-check.sh bench/.work/suite/cases/solutions/Compiler-Unions/tsconfig.json
  - name: xstate-main
    exec: bench/codspeed-check.sh bench/.work/solutions/xstate-main
  - name: webpack
    exec: bench/codspeed-check.sh bench/.work/solutions/webpack
  - name: drizzle-orm
    exec: bench/codspeed-check.sh bench/.work/solutions/drizzle-orm

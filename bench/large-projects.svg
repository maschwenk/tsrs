<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title description">
  <title id="title">TypeScript 7 versus tsrs on VS Code, T3 Code and MUI docs</title>
  <desc id="description">VS Code (microsoft/vscode, src): 10,427 files loaded by tsrs. TypeScript 7 takes 10.92 seconds and 7.55 GiB peak RSS; tsrs takes 0.82 seconds and 2.09 GiB. 13.2 times faster, 72 percent less memory. T3 Code (pingdotgg/t3code, apps/server): 2,945 files loaded by tsrs. TypeScript 7 takes 14.63 seconds and 6.18 GiB peak RSS; tsrs takes 1.48 seconds and 2.16 GiB. 9.9 times faster, 65 percent less memory. MUI docs (mui/material-ui, docs): 16,766 files loaded by tsrs. TypeScript 7 takes 11.95 seconds and 7.45 GiB peak RSS; tsrs takes 0.83 seconds and 1.60 GiB. 14.4 times faster, 79 percent less memory. Lower is better. All use the same 16-vCPU Linux runner specification and default settings. File counts include libraries and dependencies. Shared bar scales: time 0–16 seconds, memory 0–8 GiB. Static snapshot measured October 11, 2026; tsrs follows TypeScript 7.1-dev and is compared with TypeScript 7.0.2.</desc>
  <metadata>Static source: bench/results/2026-10-11-306c14f5b3ec.json; mode: wide; tsrs commit: 306c14f5b3ec3c4c27211a22cd73c8eb4981f724; measured: 2026-10-11 10:55 UTC; TypeScript reference: b85298b6a81f772d080b0455de0ca9d744cd6fd6. Details: https://github.com/maschwenk/tsrs/blob/main/bench/RESULTS.md#large-project-chart-snapshot</metadata>
  <rect x="0.5" y="0.5" width="959" height="939" rx="20" fill="#fafcfb" stroke="#dce5e1" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#162d27">
    <text x="40" y="55" font-size="34" font-weight="700">TypeScript 7 vs tsrs</text>
    <g id="vscode">
      <rect x="24" y="88" width="912" height="266" rx="12" fill="#ffffff" stroke="#e0e8e3" />
      <text x="48" y="125" font-size="27" font-weight="700">VS Code</text>
      <text x="48" y="152" font-size="17" fill="#52655e">microsoft/vscode · src</text>
      <text x="912" y="125" text-anchor="end" font-size="25" font-weight="700">10,427 files</text>
      <line x1="48" y1="169" x2="912" y2="169" stroke="#e3eae6" />
      <g data-metric="wall_s">
        <text x="48" y="203" font-size="19" font-weight="600">Time</text>
        <text x="446" y="203" text-anchor="end" font-size="23" font-weight="700" fill="#087b5b">13.2× faster</text>
        <text x="48" y="233" font-size="17" font-weight="400">TypeScript 7</text>
        <text x="446" y="233" text-anchor="end" font-size="19" font-weight="700" fill="#3178c6">10.92 s</text>
        <rect x="48" y="243" width="398" height="20" rx="3" fill="#eef3f0" />
        <rect data-compiler="tsgo" x="48" y="243" width="271.5604" height="20" rx="3" fill="#3178c6" />
        <text x="48" y="295" font-size="17" font-weight="700">tsrs</text>
        <text x="446" y="295" text-anchor="end" font-size="19" font-weight="700" fill="#087b5b">0.82 s</text>
        <rect x="48" y="305" width="398" height="20" rx="3" fill="#eef3f0" />
        <rect data-compiler="tsrs" x="48" y="305" width="20.5094" height="20" rx="3" fill="#087b5b" />
      </g>
      <g data-metric="peak_rss_bytes">
        <text x="514" y="203" font-size="19" font-weight="600">Peak memory</text>
        <text x="912" y="203" text-anchor="end" font-size="23" font-weight="700" fill="#087b5b">72% less</text>
        <text x="514" y="233" font-size="17" font-weight="400">TypeScript 7</text>
        <text x="912" y="233" text-anchor="end" font-size="19" font-weight="700" fill="#3178c6">7.55 GiB</text>

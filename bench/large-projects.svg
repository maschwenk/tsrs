<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1128" viewBox="0 0 960 1128" role="img" aria-labelledby="title description">
  <title id="title">TypeScript 7 versus tsrs on MUI docs, Supabase Studio and VS Code</title>
  <desc id="description">MUI docs (mui/material-ui, docs): 16,766 files loaded by tsrs. TypeScript 7 takes 11.95 seconds and 7.45 GiB peak RSS; tsrs takes 0.83 seconds and 1.60 GiB. 14.4 times faster, 79 percent less memory. Supabase Studio (supabase/supabase, apps/studio): 12,550 files loaded by tsrs. TypeScript 7 takes 6.72 seconds and 4.88 GiB peak RSS; tsrs takes 0.62 seconds and 1.69 GiB. 10.8 times faster, 65 percent less memory. VS Code (microsoft/vscode, src): 10,427 files loaded by tsrs. TypeScript 7 takes 10.92 seconds and 7.55 GiB peak RSS; tsrs takes 0.82 seconds and 2.09 GiB. 13.2 times faster, 72 percent less memory. All use the same 16-vCPU Linux runner specification and default settings. File counts include libraries and dependencies. Static snapshot measured October 11, 2026; tsrs follows TypeScript 7.1-dev and is compared with TypeScript 7.0.2.</desc>
  <metadata>Static source: bench/results/2026-10-11-306c14f5b3ec.json; mode: wide; tsrs commit: 306c14f5b3ec3c4c27211a22cd73c8eb4981f724; measured: 2026-10-11 10:55 UTC; TypeScript reference: b85298b6a81f772d080b0455de0ca9d744cd6fd6. Details: https://github.com/maschwenk/tsrs/blob/main/bench/RESULTS.md#large-project-chart-snapshot</metadata>

        <text x="912" y="577" text-anchor="end" font-size="19" font-weight="700" fill="#087b5b">2.13 GiB</text>
        <rect x="514" y="587" width="398" height="20" rx="3" fill="#eef3f0" />
        <rect data-compiler="tsrs" x="514" y="587" width="106.1395" height="20" rx="3" fill="#087b5b" />
      </g>
    </g>

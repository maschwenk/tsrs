      <g data-metric="wall_s">
        <text x="48" y="203" font-size="19" font-weight="600">Time</text>
        <text x="446" y="203" text-anchor="end" font-size="23" font-weight="700" fill="#087b5b">12.7× faster</text>
        <text x="48" y="233" font-size="17" font-weight="400">TypeScript 7</text>
        <text x="446" y="233" text-anchor="end" font-size="19" font-weight="700" fill="#3178c6">10.96 s</text>

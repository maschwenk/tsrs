<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title description">
  <title id="title">TypeScript 7 versus tsrs on VS Code, T3 Code and MUI docs</title>
  <desc id="description">VS Code (microsoft/vscode · src): 10,427 files loaded by tsrs. Time: TypeScript 7 11.07 s; tsrs 0.85 s; 13.1× faster. Peak memory: TypeScript 7 7.73 GiB; tsrs 2.09 GiB; 73% less. Machine: Depot CI depot-ubuntu-24.04-16 (16 vCPU, 63 GB RAM, Linux x86_64, AMD EPYC 9R45 96-Core Processor). T3 Code (pingdotgg/t3code · apps/server): 2,945 files loaded by tsrs. Heavy use of Effect and Zod. Time: TypeScript 7 12.99 s; tsrs 1.29 s; 10.1× faster. Peak memory: TypeScript 7 6.15 GiB; tsrs 2.10 GiB; 66% less. Machine: Depot CI depot-ubuntu-24.04-16 (16 vCPU, 63 GB RAM, Linux x86_64, AMD EPYC 9R45 96-Core Processor). MUI docs (mui/material-ui · docs): 16,766 files loaded by tsrs. Time: TypeScript 7 12.29 s; tsrs 0.73 s; 16.7× faster. Peak memory: TypeScript 7 7.62 GiB; tsrs 1.60 GiB; 79% less. Machine: Depot CI depot-ubuntu-24.04-16 (16 vCPU, 63 GB RAM, Linux x86_64, AMD EPYC 9R45 96-Core Processor). Lower is better. Median of 10 interleaved runs (3 for tsgo), using default compiler settings. tsrs uses PGO-optimized dist build, built like the npm release binaries. File counts include libraries and dependencies. Shared bar scales: time 0–16 seconds, memory 0–8 GiB. Failed or unavailable measurements are marked n/a. Measured 2026-10-11 21:00 UTC; tsrs commit fa529e47e5edd5110360b891a224bc4472eefa21. TypeScript 7.0.2; TypeScript reference b85298b6a81f772d080b0455de0ca9d744cd6fd6.</desc>
  <metadata>Generated by bench/chart.py; mode: wide; tsrs commit: fa529e47e5edd5110360b891a224bc4472eefa21; measured: 2026-10-11 21:00 UTC; build: pgo-dist. Details: https://github.com/maschwenk/tsrs/blob/main/bench/RESULTS.md</metadata>

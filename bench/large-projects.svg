<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title description">
  <title id="title">TypeScript 7 versus tsrs on VS Code, T3 Code and MUI docs</title>
  <desc id="description">VS Code (microsoft/vscode, src): 10,427 files loaded by tsrs. TypeScript 7 takes 10.96 seconds and 7.63 GiB peak RSS; tsrs takes 0.86 seconds and 2.09 GiB. 12.7 times faster, 73 percent less memory. T3 Code (pingdotgg/t3code, apps/server): 2,945 files loaded by tsrs. Heavy use of Effect and Zod. TypeScript 7 takes 13.66 seconds and 6.19 GiB peak RSS; tsrs takes 1.37 seconds and 2.14 GiB. 10.0 times faster, 65 percent less memory. MUI docs (mui/material-ui, docs): 16,766 files loaded by tsrs. TypeScript 7 takes 12.24 seconds and 7.50 GiB peak RSS; tsrs takes 0.86 seconds and 1.60 GiB. 14.2 times faster, 79 percent less memory. Lower is better. Medians of 10 tsrs runs and 3 TypeScript runs on a 16-vCPU Linux runner, using default compiler settings. tsrs uses the PGO-optimized dist build. File counts include libraries and dependencies. Shared bar scales: time 0–16 seconds, memory 0–8 GiB. Static snapshot measured October 11, 2026 at 14:32 UTC; tsrs follows TypeScript 7.1-dev and is compared with TypeScript 7.0.2.</desc>
  <metadata>Static source: bench/results/2026-10-11-b8bdd76bf789.json; mode: wide; tsrs commit: b8bdd76bf789975cbc4d558d9d42fa78675abfd1; measured: 2026-10-11 14:32 UTC; build: pgo-dist; median of 10 tsrs runs and 3 TypeScript runs; TypeScript: 7.0.2; TypeScript reference: b85298b6a81f772d080b0455de0ca9d744cd6fd6. Details: https://github.com/maschwenk/tsrs/blob/main/bench/RESULTS.md#large-project-chart-snapshot</metadata>
  <rect x="0.5" y="0.5" width="959" height="939" rx="20" fill="#fafcfb" stroke="#dce5e1" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#162d27">
    <text x="40" y="55" font-size="34" font-weight="700">TypeScript 7 vs tsrs</text>
    <g id="vscode">

        <rect data-compiler="tsgo" x="48" y="243" width="272.5305" height="20" rx="3" fill="#3178c6" />
        <text x="48" y="295" font-size="17" font-weight="700">tsrs</text>
        <text x="446" y="295" text-anchor="end" font-size="19" font-weight="700" fill="#087b5b">0.86 s</text>
        <rect x="48" y="305" width="398" height="20" rx="3" fill="#eef3f0" />
        <rect data-compiler="tsrs" x="48" y="305" width="21.4049" height="20" rx="3" fill="#087b5b" />
      </g>
      <g data-metric="peak_rss_bytes">
        <text x="514" y="203" font-size="19" font-weight="600">Peak memory</text>
        <text x="912" y="203" text-anchor="end" font-size="23" font-weight="700" fill="#087b5b">73% less</text>
        <text x="514" y="233" font-size="17" font-weight="400">TypeScript 7</text>

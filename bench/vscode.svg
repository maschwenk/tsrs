<svg xmlns="http://www.w3.org/2000/svg" width="800" height="652" viewBox="0 0 800 652" role="img" aria-labelledby="title description">
  <title id="title">Type-checking VS Code: tsrs versus TypeScript 7</title>
  <desc id="description">tsrs takes 0.86 seconds versus TypeScript 7's 10.77 seconds, 12.6 times faster. Peak memory is 2.09 GiB versus 7.49 GiB, 72 percent lower. Lower is better. Measured October 11, 2026 on 16 vCPUs, AMD EPYC 9R45, Linux x64, with default settings. Medians of 10 tsrs runs and 3 TypeScript runs. tsrs 0.13.0 follows TypeScript 7.1-dev; the comparison compiler is TypeScript 7.0.2.</desc>
  <metadata>Static snapshot: bench/results/2026-10-11-e883456c0758.json, projects.vscode.wide. tsrs commit e883456c075892b105631d7e8a28d65227ce6367; PGO dist build; pinned TypeScript b85298b6. Wall seconds: tsrs 0.8565, tsgo 10.771. Peak RSS bytes: tsrs 2244261888, tsgo 8047595520. Details: https://github.com/maschwenk/tsrs/blob/main/bench/RESULTS.md#vs-code-chart-snapshot</metadata>
  <rect x="0.5" y="0.5" width="799" height="651" rx="20" fill="#fafcfb" stroke="#dce5e1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#162d27">
    <text x="36" y="51" font-size="28" font-weight="700">Type-checking VS Code</text>
    <text x="36" y="80" font-size="16" fill="#52655e">10,427 files · Default settings · Lower is better</text>

    <rect x="20" y="105" width="760" height="207" rx="12" fill="#ffffff" stroke="#e3eae6"/>
    <text x="36" y="141" font-size="20" font-weight="650">Time</text>
    <text x="764" y="141" text-anchor="end" font-size="23" font-weight="700" fill="#087b5b">12.6× faster</text>
    <text x="36" y="176" font-size="17">TypeScript 7</text>
    <text x="764" y="176" text-anchor="end" font-size="18" font-weight="600">10.77 s</text>
    <rect x="36" y="188" width="728" height="26" rx="4" fill="#3178c6"/>
    <text x="36" y="247" font-size="17" font-weight="700">tsrs</text>
    <text x="764" y="247" text-anchor="end" font-size="18" font-weight="700" fill="#087b5b">0.86 s</text>
    <rect x="36" y="259" width="728" height="26" rx="4" fill="#eef3f0"/>
    <rect x="36" y="259" width="57.89" height="26" rx="4" fill="#0c9671"/>

    <rect x="20" y="328" width="760" height="207" rx="12" fill="#ffffff" stroke="#e3eae6"/>

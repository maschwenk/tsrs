    <text x="36" y="399" font-size="17">TypeScript 7</text>
    <text x="764" y="399" text-anchor="end" font-size="18" font-weight="600">7.49 GiB</text>
    <rect x="36" y="411" width="728" height="26" rx="4" fill="#3178c6"/>
    <text x="36" y="470" font-size="17" font-weight="700">tsrs</text>

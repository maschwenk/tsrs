name: Top repository conformance

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/repo-conformance/**"
      - ".github/workflows/repo-conformance.yml"
      - ".node-version"
      - "npm/build.mjs"
  pull_request:
    branches: [main]
    paths:
      - "tools/repo-conformance/**"
      - ".github/workflows/repo-conformance.yml"
  workflow_dispatch:
    inputs:
      count:
        description: Number of popular repositories (1-400)
        type: number
        default: 400
      rerun_run_id:
        description: Rerun shards of this earlier run with its manifest, compilers and repository commits (requires rerun_shards)
        type: string
        default: ""
      rerun_shards:
        description: Comma-separated shard indexes to rerun (requires rerun_run_id)
        type: string
        default: ""

concurrency:
  group: repo-conformance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.rerun_run_id && format('rerun-{0}', inputs.rerun_run_id) || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix || steps.rerun.outputs.matrix }}
      harness: ${{ steps.rerun.outputs.harness || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the rerun inputs
        env:
          RUN_ID: ${{ inputs.rerun_run_id }}
          SHARDS: ${{ inputs.rerun_shards }}
        run: python3 tools/repo-conformance/run.py dispatch --run-id "$RUN_ID" --shards "$SHARDS"
      - name: Check repository isolation
        env:
          TSRS_CONFORMANCE_SANDBOX_IMAGE: tsrs-repo-conformance
        run: |
          docker build --tag tsrs-repo-conformance tools/repo-conformance
          python3 -m unittest discover -s tools/repo-conformance -p 'test_sandbox.py' -v
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - name: Read the earlier run
        if: inputs.rerun_run_id
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.rerun_run_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/earlier-run.json"
      - name: Read the earlier run's manifest and compilers
        if: inputs.rerun_run_id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repo-conformance-inputs
          path: repo-conformance
          run-id: ${{ inputs.rerun_run_id }}
          github-token: ${{ github.token }}
      - name: Select shards to rerun
        id: rerun
        if: inputs.rerun_run_id
        env:
          SHARDS: ${{ inputs.rerun_shards }}
        run: |
          python3 tools/repo-conformance/run.py rerun --manifest repo-conformance/manifest.json --shards "$SHARDS" \
            --run "$RUNNER_TEMP/earlier-run.json"
          echo "harness=$(jq -r .tsrs_commit repo-conformance/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Read TypeScript reference commit
        id: ts
        if: ${{ !inputs.rerun_run_id }}
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ !inputs.rerun_run_id }}
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !inputs.rerun_run_id }}
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum
      - name: Set up Rust
        if: ${{ !inputs.rerun_run_id }}
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.rerun_run_id }}
        with:
          key: repo-conformance
      - name: Build the two compilers
        if: ${{ !inputs.rerun_run_id }}
        run: |
          cargo build --release --locked -p tsrs_cli
          mkdir -p repo-conformance/bin
          cp target/release/tsrs repo-conformance/bin/tsrs
          cd ts-ref/tsc
          go build -o "$GITHUB_WORKSPACE/repo-conformance/bin/tsgo" ./cmd/tsc
      - name: Check the harness and compiler controls
        if: ${{ !inputs.rerun_run_id }}
        env:
          TSRS_CONFORMANCE_TSRS: ${{ github.workspace }}/repo-conformance/bin/tsrs
          TSRS_CONFORMANCE_TSGO: ${{ github.workspace }}/repo-conformance/bin/tsgo
        run: python3 -m unittest discover -s tools/repo-conformance -p 'test_*.py' -v
      - name: Select popular TypeScript repositories
        id: plan
        if: ${{ !inputs.rerun_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_COUNT: ${{ github.event_name == 'pull_request' && '20' || inputs.count || '400' }}
        run: python3 tools/repo-conformance/run.py plan --count "$REPO_COUNT" --out repo-conformance/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-conformance-inputs
          path: repo-conformance/
          retention-days: 14
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.harness }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repo-conformance-inputs
          path: repo-conformance
      - name: Compare projects
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          docker build --tag tsrs-repo-conformance tools/repo-conformance
          chmod +x repo-conformance/bin/tsgo repo-conformance/bin/tsrs
          python3 tools/repo-conformance/run.py run --manifest repo-conformance/manifest.json \
            --shard "$SHARD" --tsgo repo-conformance/bin/tsgo --tsrs repo-conformance/bin/tsrs \
            --out repo-conformance/results --cache "$RUNNER_TEMP/repo-conformance-work" \
            --sandbox-image tsrs-repo-conformance
      - name: Remove repository sandboxes
        if: always()
        run: docker ps --all --quiet --filter label=tsrs.repo-conformance | xargs --no-run-if-empty docker rm --force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: repo-conformance-shard-${{ matrix.shard }}
          path: repo-conformance/results/
          retention-days: 14
          if-no-files-found: error

  report:
    needs: [build, compare]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.harness }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: repo-conformance-*
          path: repo-conformance-downloads
      - name: Read the earlier run's shard results
        if: inputs.rerun_run_id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: repo-conformance-shard-*
          path: repo-conformance-previous
          run-id: ${{ inputs.rerun_run_id }}
          github-token: ${{ github.token }}
      - name: Report compatibility and coverage
        env:
          PREVIOUS: ${{ inputs.rerun_run_id && 'repo-conformance-previous' || '' }}
        run: |
          status=0
          python3 tools/repo-conformance/run.py report \
            --manifest repo-conformance-downloads/repo-conformance-inputs/manifest.json \
            --results repo-conformance-downloads ${PREVIOUS:+--previous "$PREVIOUS"} \
            --out repo-conformance-report.md || status=$?
          cat repo-conformance-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: repo-conformance-report
          path: repo-conformance-report.md
          retention-days: 14
          if-no-files-found: error

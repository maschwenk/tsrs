# Node programmatic API (`tsrs --api`, unstable/sync + unstable/async) validation on macOS. See
# docs/NODE_API_VALIDATION.md. Parity and the Linux packages run on Depot CI (.depot/workflows/node-api.yml), which has
# no macOS sandboxes and does not run pull requests from forks.
# Security: read-only GITHUB_TOKEN, no secrets, nothing is published (no pnpm publish, no tags, no releases).
# Triggers: pushes to main, manual dispatch (needs this file on the default branch), and pull requests into main
# that touch the API surface. `pull_request` (never `pull_request_target`) runs with a read-only token and no
# secrets; fork PRs additionally wait for the repository's approval setting. This lets the API branches be
# validated before anything is merged.

name: Node API (macOS)

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "npm/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tools/node-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "npm/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tools/node-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-api.yml"
  workflow_dispatch:

# Pushes to main each run to completion; a newer commit on the same pull request cancels the older run.
concurrency:
  group: node-api-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pack tsrs exactly as a release would (without publishing), install the tarballs into a project outside the
  # repository and drive the installed binary through the CLI, unstable/sync, unstable/async and the published
  # declarations. The Linux targets run on Depot CI (.depot/workflows/node-api.yml).
  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - parallel:
          - name: Set up Node
            uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

          - name: Set up Rust
            uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
            with:
              toolchain: ${{ steps.rust.outputs.toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node-api-${{ matrix.target }}

      # Keep diagnostics for a slow or stuck native build in a separate log, then stop the monitor explicitly.
      - name: Monitor build resources
        id: resource-monitor
        run: |
          while true; do
            date -u
            vm_stat
            top -l 1 -n 10 -o cpu -stats pid,cpu,mem,command
            sleep 60
          done
        background: true

      - name: Build tsrs
        id: build
        run: cargo build --release --locked -p tsrs_cli
        background: true

      - name: Wait for the Rust build
        wait: build

      - name: Stop build resource monitor
        cancel: resource-monitor

      - name: Pack (no publish)
        run: node npm/build.mjs --binary ${{ matrix.target }}=target/release/tsrs --out "$RUNNER_TEMP/pack" --pack

      - name: Installed-package smoke (CLI, sync, async, declarations)
        run: node tools/node-api/consumer.mjs --dist "$RUNNER_TEMP/pack"

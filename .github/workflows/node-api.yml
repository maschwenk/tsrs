name: pnpm Linux diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 38067052302
          name: bin-${{ matrix.target }}
          path: artifacts
          github-token: ${{ github.token }}
      - name: pnpm install
        run: pnpm --dir npm install --frozen-lockfile
      - name: Pack
        run: |
          chmod +x artifacts/${{ matrix.target }}/tsrs
          node npm/build.mjs --artifacts artifacts --pack
      - name: Consumer
        run: node tools/node-api/consumer.mjs --dist npm/dist
      - name: SDK
        run: node npm/sdk/smoke-consumer.mjs
      - name: Release training setup
        run: python3 bench/run.py --setup-only --projects xstate-main,webpack --work-dir target/pnpm-bench

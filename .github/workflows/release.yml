# Builds the tsrs binaries and the WebAssembly module and publishes the npm packages (npm/README.md), all at the
# version npm/build.mjs derives from Cargo.toml. The conformance and fourslash gates run here on the BOLT-optimized
# Linux binaries (.github/scripts/bolt.sh). The macOS binary gets only the smoke tests below; nothing runs the suites
# on macOS (.depot/workflows/ci.yml, Linux only, gates the source). The WebAssembly differential gate
# (tools/wasm/gate.sh) runs only in ci.yml.
#
# Setup before the first release:
#   - repository secret NPM_TOKEN: an npm automation (or granular, publish-enabled) token for an account that may
#     publish `tsrs`, `@ts-rs/wasm` and the platform packages in the `@ts-rs` org.
#   - tag pushes `v<workspace version>` or `v<npm version>` (node npm/build.mjs --print-version), e.g. v0.1.0.
# Provenance (`npm publish --provenance`) is only possible from a public repository; it is enabled automatically
# when the repository is public and skipped while it is private.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but run `npm publish --dry-run`"
        type: boolean
        default: true

# One release per ref at a time; never cancel a publish half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ts_commit: ${{ steps.v.outputs.ts_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then node npm/build.mjs --check-tag "$GITHUB_REF_NAME"; fi
          echo "version=$(node npm/build.mjs --print-version)" >> "$GITHUB_OUTPUT"
          echo "ts_commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

  # Release binaries are PGO builds with the `dist` profile (fat LTO, one codegen unit; Cargo.toml): an instrumented
  # build of tsrs + tsrs-test + tsrs-fourslash, the training workload (.github/scripts/pgo-train.sh: the conformance and fourslash suites
  # and two open-source bench projects), then the final build with the merged profile. Numbers: notes/perf-pgo.md.
  # On Linux the final build is then optimized with BOLT (.github/scripts/bolt.sh; notes/perf-build-level.md), and
  # the conformance and fourslash gates run on BOLT-optimized binaries before the binary is staged.
  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, experimental: false, run: true }
          # No Intel macOS build: nobody asked for it, and its PGO step had to train under Rosetta 2.
          # Built on 22.04 so the binary needs at most glibc 2.35.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, experimental: false, run: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, experimental: false, run: true }
          # Not built yet (npm/README.md TODO): win32-x64. The main package lists only the platforms built here.
          # - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true, run: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance suite (part of the training workload) reads its tests from ts-ref/tsc/testdata.
      - name: Check out TypeScript testdata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ needs.version.outputs.ts_commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false
      # The bench projects of the training workload install with npm/pnpm/yarn (bench/run.py --setup-only).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ matrix.target }}
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-pgo
      # Everything of the PGO steps but the final build lives outside target/, which rust-cache saves.
      # CFLAGS: cc passes -Cprofile-generate/-use on to clang (macOS) but not to gcc (Linux). Apple clang's profile
      # format does not match rustc's LLVM (the instrumented mimalloc crashed in __llvm_profile_instrument_target
      # with rustc 1.99), so the C code (mimalloc) is built without PGO, as on Linux.
      - name: Instrumented build
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-generate=${{ runner.temp }}/pgo/raw
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-profile-generate' || '' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/pgo/target
          # The same as the final build's: profile settings are part of every symbol name, and the profile only
          # applies to functions whose names match (notes/perf-pgo.md, 2026-10-09).
          CARGO_PROFILE_DIST_STRIP: ${{ runner.os == 'Linux' && 'none' || 'symbols' }}
        run: cargo build --profile dist --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_fourslash --target ${{ matrix.target }}
      - name: Training run
        shell: bash
        run: .github/scripts/pgo-train.sh "$RUNNER_TEMP/pgo/target/${{ matrix.target }}/dist" "$RUNNER_TEMP/pgo/raw" "$RUNNER_TEMP/pgo/bench"
      - name: Merge profiles
        id: profile
        shell: bash
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -o "$RUNNER_TEMP/pgo/merged.profdata" "$RUNNER_TEMP"/pgo/raw/*.profraw
          "$profdata" show "$RUNNER_TEMP/pgo/merged.profdata" | tail -5
          # The profile's hash is part of its path, and so of RUSTFLAGS: cargo then rebuilds dependencies restored by
          # rust-cache whenever the profile changes.
          sum=$(shasum -a 256 "$RUNNER_TEMP/pgo/merged.profdata" | cut -c1-16)
          mv "$RUNNER_TEMP/pgo/merged.profdata" "$RUNNER_TEMP/pgo/$sum.profdata"
          echo "path=$RUNNER_TEMP/pgo/$sum.profdata" >> "$GITHUB_OUTPUT"
      # Linux: --emit-relocs keeps the relocations BOLT needs to move code (the code itself is unchanged), and the
      # test runners are built too so that the BOLT step can run the gates on BOLT-optimized binaries.
      - name: cargo build
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-use=${{ steps.profile.outputs.path }}${{ runner.os == 'Linux' && ' -Clink-arg=-Wl,--emit-relocs' || '' }}
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-profile-use' || '' }}
          # BOLT needs the Linux binaries' symbols; bolt.sh strips the optimized tsrs after its correctness gates.
          # The instrumented build sets the same value.
          CARGO_PROFILE_DIST_STRIP: ${{ runner.os == 'Linux' && 'none' || 'symbols' }}
        run: |
          pkgs=(-p tsrs_cli)
          [ "$RUNNER_OS" = Linux ] && pkgs+=(-p tsrs_testrunner -p tsrs_fourslash)
          cargo build --profile dist --locked "${pkgs[@]}" --target ${{ matrix.target }}
      # BOLT from the LLVM release that matches rustc's LLVM. The tarball's tools need glibc 2.34 (22.04 has 2.35).
      - name: Install BOLT
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm=$(rustc -vV | sed -n 's/^LLVM version: //p')
          arch=X64; [ "$(uname -m)" = aarch64 ] && arch=ARM64
          name="LLVM-$llvm-Linux-$arch"
          mkdir -p "$RUNNER_TEMP/llvm"
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm/$name.tar.zst" |
            tar -x --zstd -C "$RUNNER_TEMP/llvm" --strip-components=1 --wildcards \
              "$name/bin/llvm-bolt" "$name/bin/merge-fdata" "$name/lib/libbolt_rt_instr.a"
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
      - name: BOLT and gates on the BOLT-optimized binaries
        if: runner.os == 'Linux'
        shell: bash
        run: .github/scripts/bolt.sh "target/${{ matrix.target }}/dist" "$RUNNER_TEMP/bolt" "$RUNNER_TEMP/pgo/bench"
      - name: Stage binary
        shell: bash
        run: |
          exe=tsrs; [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ] && exe=tsrs.exe
          mkdir -p "out/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/dist/$exe" "out/${{ matrix.target }}/$exe"
          if [ "${{ matrix.run }}" = true ]; then
            "out/${{ matrix.target }}/$exe" --version
            printf 'const x: number = "no";\n' > bad.ts
            set +e; "out/${{ matrix.target }}/$exe" bad.ts; status=$?; set -e
            [ "$status" = 2 ] || { echo "expected exit 2 for a type error, got $status"; exit 1; }
          fi
      - name: Installed-package smoke (CLI and Node API)
        shell: bash
        run: |
          npm ci --prefix npm --no-audit --no-fund
          node npm/build.mjs --artifacts out --pack
          node npm/sdk/smoke-consumer.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  check:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --locked

  # `@ts-rs/wasm` (npm/tsrs-wasm, notes/wasm-build.md): the module as ci.yml's wasm job builds it, the
  # package's tests (they compare against a native release build), the package packed by npm/build.mjs, and that
  # tarball installed and run before it is handed to the publish job.
  wasm:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Same binaryen as ci.yml (the module sizes in notes/wasm-build.md come from version 133).
      - name: Install binaryen 133
        run: |
          curl -sSLf -o "$RUNNER_TEMP/binaryen.tgz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build the module
        run: tools/wasm/build.sh
      - name: Build native tsrs (npm test compares against it)
        run: cargo build --release --locked -p tsrs_cli
      - name: npm test (npm/tsrs-wasm)
        run: npm test --prefix npm/tsrs-wasm
      - name: Pack
        run: node npm/build.mjs --wasm npm/tsrs-wasm/tsrs.wasm --out wasm-dist --pack
      - name: Installed-package smoke
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tarball=$(node -p 'require("./wasm-dist/packages.json").packages[0].tarball')
          smoke="$RUNNER_TEMP/wasm-smoke"
          mkdir -p "$smoke" && cd "$smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball"
          npx --no-install tsrs-wasm --version | tee version.txt
          grep -qF "(tsrs $VERSION," version.txt || { echo "::error::tsrs-wasm --version does not name $VERSION"; exit 1; }
          printf 'const x: number = "no";\n' > bad.ts
          set +e; npx --no-install tsrs-wasm bad.ts; status=$?; set -e
          [ "$status" = 2 ] || { echo "expected exit 2 for a type error, got $status"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-wasm
          path: |
            wasm-dist/*.tgz
            wasm-dist/packages.json
          if-no-files-found: error

  publish:
    needs: [version, check, build, wasm]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same Node as ci.yml's packaging smoke test, which builds the unstable/* JS API with these tools.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-wasm
          path: wasm-dist
      - name: Require the release platforms and the WebAssembly package
        run: |
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "artifacts/$t/tsrs" || { echo "::error::missing binary for $t"; exit 1; }
          done
          ls -lR artifacts wasm-dist
      # npm/build.mjs compiles the unstable/* JS API with npm/package.json's build-only tools (same
      # prerequisite as ci.yml's packaging smoke test); branches without that manifest have nothing to install.
      - name: Assemble and pack
        run: |
          if [ -f npm/package-lock.json ]; then npm ci --prefix npm --no-audit --no-fund; fi
          node npm/build.mjs --artifacts artifacts --pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm/dist/*.tgz
      - name: Publish (@ts-rs platform packages, tsrs, then @ts-rs/wasm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          VERSION: ${{ needs.version.outputs.version }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          flags=(--access public --tag latest)
          [ "$PRIVATE_REPO" = false ] && flags+=(--provenance)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          if [ "$DRY_RUN" != true ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"; exit 1
          fi
          # The WebAssembly manifest comes from the wasm job, whose absolute paths are not this runner's: its tarball
          # is looked up next to the manifest. Both manifests must carry the version the skip check below asks for.
          # The list is written first so that a failure here fails the step (the default shell has no pipefail).
          node -e '
            const path = require("path");
            for (const dir of ["npm/dist", "wasm-dist"]) {
              const m = require(path.resolve(dir, "packages.json"));
              if (m.version !== process.env.VERSION) throw new Error(dir + "/packages.json: version " + m.version + ", expected " + process.env.VERSION);
              for (const p of m.packages) console.log(p.name + " " + path.resolve(dir, path.basename(p.tarball)));
            }' > "$RUNNER_TEMP/publish.txt"
          cat "$RUNNER_TEMP/publish.txt"
          while read -r name tarball; do
            # Re-running a partially published release skips what is already on the registry.
            if [ "$DRY_RUN" != true ] && npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION already published"
              continue
            fi
            npm publish "$tarball" "${flags[@]}"
          done < "$RUNNER_TEMP/publish.txt"

# Builds the tsrs binaries, gates on the conformance suite, and publishes the npm packages (npm/README.md).
#
# Setup before the first release:
#   - repository secret NPM_TOKEN: an npm automation (or granular, publish-enabled) token for an account that may
#     publish to the package scope (npm/tsrs/package.json "name"; the @maschwenk scope exists iff the npm user is
#     maschwenk, otherwise create the org or rename the package there).
#   - tag pushes `v<workspace version>` or `v<npm version>` (node npm/build.mjs --print-version), e.g. v0.1.0.
# Provenance (`npm publish --provenance`) is only possible from a public repository; it is enabled automatically
# when the repository is public and skipped while it is private.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but run `npm publish --dry-run`"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ts_commit: ${{ steps.v.outputs.ts_commit }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then node npm/build.mjs --check-tag "$GITHUB_REF_NAME"; fi
          echo "version=$(node npm/build.mjs --print-version)" >> "$GITHUB_OUTPUT"
          echo "ts_commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, experimental: false, run: true }
          # Cross-compiled on the arm64 runner (Apple's toolchain targets both architectures).
          - { target: x86_64-apple-darwin, os: macos-14, experimental: false, run: false }
          # Built on 22.04 so the binary needs at most glibc 2.35.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, experimental: false, run: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, experimental: false, run: true }
          # Best effort: a failure here does not block the release; the main package then omits win32-x64.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true, run: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: cargo build
        shell: bash
        run: cargo build --release --locked -p tsrs_cli --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          exe=tsrs; [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ] && exe=tsrs.exe
          mkdir -p "out/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/$exe" "out/${{ matrix.target }}/$exe"
          if [ "${{ matrix.run }}" = true ]; then
            "out/${{ matrix.target }}/$exe" --version
            printf 'const x: number = "no";\n' > bad.ts
            set +e; "out/${{ matrix.target }}/$exe" bad.ts; status=$?; set -e
            [ "$status" = 2 ] || { echo "expected exit 2 for a type error, got $status"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  conformance:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: ${{ needs.version.outputs.ts_commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tsrs_testrunner
      - run: .github/scripts/conformance-gate.sh

  publish:
    needs: [version, build, conformance]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Require the non-experimental platforms
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "artifacts/$t/tsrs" || { echo "::error::missing binary for $t"; exit 1; }
          done
          ls -lR artifacts
      - name: Assemble and pack
        run: node npm/build.mjs --artifacts artifacts --pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm/dist/*.tgz
      - name: Publish (platform packages first, then the main package)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          flags=(--access public --tag latest)
          [ "$PRIVATE_REPO" = false ] && flags+=(--provenance)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          if [ "$DRY_RUN" != true ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"; exit 1
          fi
          node -e 'for (const p of require("./npm/dist/packages.json").packages) console.log(p.name + " " + p.tarball)' |
          while read -r name tarball; do
            # Re-running a partially published release skips what is already on the registry.
            if [ "$DRY_RUN" != true ] && npm view "$name@${{ needs.version.outputs.version }}" version > /dev/null 2>&1; then
              echo "$name@${{ needs.version.outputs.version }} already published"
              continue
            fi
            npm publish "$tarball" "${flags[@]}"
          done

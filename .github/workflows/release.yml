# Builds the tsrs binaries and publishes the npm packages (npm/README.md). The conformance suite runs in ci.yml
# and does not gate releases.
#
# Setup before the first release:
#   - repository secret NPM_TOKEN: an npm automation (or granular, publish-enabled) token for an account that may
#     publish to the package scope (npm/tsrs/package.json "name"; the @maschwenk scope exists iff the npm user is
#     maschwenk, otherwise create the org or rename the package there).
#   - tag pushes `v<workspace version>` or `v<npm version>` (node npm/build.mjs --print-version), e.g. v0.1.0.
# Provenance (`npm publish --provenance`) is only possible from a public repository; it is enabled automatically
# when the repository is public and skipped while it is private.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but run `npm publish --dry-run`"
        type: boolean
        default: true

# One release per ref at a time; never cancel a publish half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ts_commit: ${{ steps.v.outputs.ts_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then node npm/build.mjs --check-tag "$GITHUB_REF_NAME"; fi
          echo "version=$(node npm/build.mjs --print-version)" >> "$GITHUB_OUTPUT"
          echo "ts_commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

  # Release binaries are PGO builds with the `dist` profile (fat LTO, one codegen unit; Cargo.toml): an instrumented
  # build of tsrs + tsrs-test, the training workload (.github/scripts/pgo-train.sh: the conformance suite and two
  # open-source bench projects), then the final build with the merged profile. Numbers: notes/perf-pgo.md.
  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, experimental: false, run: true }
          # Cross-compiled on the arm64 runner (Apple's toolchain targets both architectures). Its profile comes
          # from its own x86_64 instrumented build, trained under Rosetta 2 on that runner: the arm64 profile does
          # not fit, because profile entries are keyed by symbol names whose hashes depend on the target triple
          # (with the arm64 profile 9.3k functions had no data instead of 1.8k, and the gain under Rosetta was 4%
          # instructions instead of 16%; notes/perf-pgo.md). The smoke test below stays off (`run: false`) as before.
          - { target: x86_64-apple-darwin, os: macos-14, experimental: false, run: false }
          # Built on 22.04 so the binary needs at most glibc 2.35.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, experimental: false, run: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, experimental: false, run: true }
          # Not built yet (npm/README.md TODO): win32-x64. The main package lists only the platforms built here.
          # - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true, run: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance suite (part of the training workload) reads its tests from ts-ref/tsc/testdata.
      - name: Check out TypeScript testdata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ needs.version.outputs.ts_commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false
      # The bench projects of the training workload install with npm/pnpm/yarn (bench/run.py --setup-only).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-pgo
      - name: Rosetta 2 (x86_64 training run on the arm64 runner)
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      # Everything of the PGO steps but the final build lives outside target/, which rust-cache saves.
      # CFLAGS: cc passes -Cprofile-generate/-use on to clang (macOS) but not to gcc (Linux). Apple clang's profile
      # format does not match rustc's LLVM (the instrumented mimalloc crashed in __llvm_profile_instrument_target
      # with rustc 1.99), so the C code (mimalloc) is built without PGO, as on Linux.
      - name: Instrumented build
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-generate=${{ runner.temp }}/pgo/raw
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-profile-generate' || '' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/pgo/target
        run: cargo build --profile dist --locked -p tsrs_cli -p tsrs_testrunner --target ${{ matrix.target }}
      - name: Training run
        shell: bash
        run: .github/scripts/pgo-train.sh "$RUNNER_TEMP/pgo/target/${{ matrix.target }}/dist" "$RUNNER_TEMP/pgo/raw" "$RUNNER_TEMP/pgo/bench"
      - name: Merge profiles
        id: profile
        shell: bash
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -o "$RUNNER_TEMP/pgo/merged.profdata" "$RUNNER_TEMP"/pgo/raw/*.profraw
          "$profdata" show "$RUNNER_TEMP/pgo/merged.profdata" | tail -5
          # The profile's hash is part of its path, and so of RUSTFLAGS: cargo then rebuilds dependencies restored by
          # rust-cache whenever the profile changes.
          sum=$(shasum -a 256 "$RUNNER_TEMP/pgo/merged.profdata" | cut -c1-16)
          mv "$RUNNER_TEMP/pgo/merged.profdata" "$RUNNER_TEMP/pgo/$sum.profdata"
          echo "path=$RUNNER_TEMP/pgo/$sum.profdata" >> "$GITHUB_OUTPUT"
      - name: cargo build
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-use=${{ steps.profile.outputs.path }}
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-profile-use' || '' }}
        run: cargo build --profile dist --locked -p tsrs_cli --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          exe=tsrs; [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ] && exe=tsrs.exe
          mkdir -p "out/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/dist/$exe" "out/${{ matrix.target }}/$exe"
          if [ "${{ matrix.run }}" = true ]; then
            "out/${{ matrix.target }}/$exe" --version
            printf 'const x: number = "no";\n' > bad.ts
            set +e; "out/${{ matrix.target }}/$exe" bad.ts; status=$?; set -e
            [ "$status" = 2 ] || { echo "expected exit 2 for a type error, got $status"; exit 1; }
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  check:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --locked

  publish:
    needs: [version, check, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Require the release platforms
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "artifacts/$t/tsrs" || { echo "::error::missing binary for $t"; exit 1; }
          done
          ls -lR artifacts
      - name: Assemble and pack
        run: node npm/build.mjs --artifacts artifacts --pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm/dist/*.tgz
      - name: Publish (platform packages first, then the main package)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          VERSION: ${{ needs.version.outputs.version }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          flags=(--access public --tag latest)
          [ "$PRIVATE_REPO" = false ] && flags+=(--provenance)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          if [ "$DRY_RUN" != true ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"; exit 1
          fi
          node -e 'for (const p of require("./npm/dist/packages.json").packages) console.log(p.name + " " + p.tarball)' |
          while read -r name tarball; do
            # Re-running a partially published release skips what is already on the registry.
            if [ "$DRY_RUN" != true ] && npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION already published"
              continue
            fi
            npm publish "$tarball" "${flags[@]}"
          done

# Automatically investigates bug reports and can open a pull request with a verified fix.
# Repository setup required before this job will run:
#   - TRIAGEBOT_GITHUB_TOKEN: a dedicated bot account's fine-grained PAT with
#     Contents, Issues, and Pull requests write access.
#   - CLOUDFLARE_API_KEY: a Workers AI API token with Workers AI Read and Edit.
#   - CLOUDFLARE_ACCOUNT_ID: the Workers AI account ID.
#   - TRIAGEBOT_LOGIN: the dedicated bot account's login, as a repository variable.

name: Issue Triage

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # Bot comments can enqueue another event before the issue's label is updated.
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      vars.TRIAGEBOT_LOGIN != '' &&
      !github.event.issue.pull_request &&
      (github.event.action != 'created' ||
       (github.event.comment.user.login != 'github-actions[bot]' &&
        github.event.comment.user.login != vars.TRIAGEBOT_LOGIN))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: true
          cache-key: triagebot

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The pinned action expects its state labels plus at least one "- P" and
      # "pkg:" label, but does not create them itself.
      - name: Create missing triage labels
        env:
          GH_TOKEN: ${{ secrets.TRIAGEBOT_GITHUB_TOKEN }}
        run: .github/scripts/setup-triagebot-labels.sh

      - name: Triage the issue
        # Cloudflare Workers AI support is newer than v0.4.0. Pin the upstream
        # commit rather than following its moving main branch.
        uses: withastro/triagebot-action@51d30da13c0bd571a3822fc56882de40fead0086 # main, 2026-08-28
        with:
          read-token: ${{ github.token }}
          write-token: ${{ secrets.TRIAGEBOT_GITHUB_TOKEN }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          triage-model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.7-code
          verification-model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.6
          triage-skill: .agents/skills/triage
          pr-skill: .agents/skills/pr-writer
          auto-pr-on-fix: true
          bot-logins: ${{ vars.TRIAGEBOT_LOGIN }}

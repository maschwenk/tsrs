name: Playground

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playground-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
            with:
              registry-url: ""

          - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
            with:
              save-cache: ${{ github.ref_name == 'main' }}
              cache-key: playground

          - name: Install Binaryen 133
            run: |
              curl -sSLf -o "$RUNNER_TEMP/binaryen.tgz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
              echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
              tar xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
              echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"

      - name: Install Chromium
        id: chromium
        background: true
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build WASM
        run: tools/wasm/build.sh

      - name: Build native reference
        id: native
        background: true
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: Check and build playground
        working-directory: playground
        run: |
          pnpm run prepare-assets
          pnpm exec vp check
          pnpm exec vp build

      - wait: native

      - name: Compare WASM with native tsrs
        working-directory: playground
        run: pnpm exec vp test run

      - wait: chromium

      - name: Verify production build in Chromium
        working-directory: playground
        run: pnpm run test:browser

      - name: Save validated site
        if: github.event_name != 'pull_request' && github.repository == 'oxc-project/tsrs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-${{ github.sha }}
          path: playground/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'oxc-project/tsrs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: playground-production
      cancel-in-progress: false
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
            with:
              registry-url: ""

          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: playground-${{ github.sha }}
              path: playground/dist/

      - name: Install Chromium
        id: chromium
        background: true
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Deploy to Void using OIDC
        run: |
          pnpm exec void connect https://api.void.cloud --no-login
          pnpm exec void deploy --platform void --project tsrs-playground --dir playground/dist

      - wait: chromium

      - name: Verify hosted playground
        working-directory: playground
        env:
          PLAYWRIGHT_BASE_URL: https://tsrs-playground.void.app
        run: |
          pnpm run test:browser
          echo "Playground: $PLAYWRIGHT_BASE_URL (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

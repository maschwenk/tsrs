[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

# The microsoft/TypeScript commit this port follows. Read by crates/tsrs_execute/build.rs (`tsrs --version`), by
# npm/build.mjs (npm version = "<workspace version>-ts<version>") and by CI (conformance testdata checkout).
# `nightly` is the npm `typescript` nightly built from `commit` (its package.json `gitHead` is `commit`, or a later
# commit that changes nothing under tsc/; 7.1.0-dev.20260930.4 adds a CI-only one). Release builds stamp it
# as TypeScript's version (TSRS_TS_VERSION, crates/tsrs_core/src/version.rs), as the nightly's own build does, so the
# tsbuildinfo `version`, `typesVersions` matching and `--version` agree with that tsgo; the release checks both.
[workspace.metadata.typescript]
version = "7.1.0-dev.20260929"
commit = "b85298b6a81f772d080b0455de0ca9d744cd6fd6"
nightly = "7.1.0-dev.20260930.4"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
rustc-hash = "2"
indexmap = "2"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
bitflags = "2"
rayon = "1"
memchr = "2"
simdutf8 = "0.1.5"
dragonbox_ecma = "0.1.12"
num-bigint = "0.5.1"
num-traits = "0.2"
mimalloc-safe = { version = "0.1.67", features = ["v3"] }
# Pin exactly: 1.1.2 uses Unicode 15.1.0, matching the pinned TypeScript identifier tables.
# Newer Unicode versions accept additional identifier characters; upgrade only when TypeScript's tables change.
unicode-id-start = "=1.1.2"
# Match the pinned Go Unicode 17 normalization tables.
unicode-normalization = "=0.1.25"
tsrs_core = { path = "crates/tsrs_core" }
tsrs_diagnostics = { path = "crates/tsrs_diagnostics" }
tsrs_spanmap = { path = "crates/tsrs_spanmap" }
tsrs_ast = { path = "crates/tsrs_ast" }
tsrs_scanner = { path = "crates/tsrs_scanner" }
tsrs_parser = { path = "crates/tsrs_parser" }
tsrs_binder = { path = "crates/tsrs_binder" }
tsrs_vfs = { path = "crates/tsrs_vfs" }
tsrs_module = { path = "crates/tsrs_module" }
tsrs_tsoptions = { path = "crates/tsrs_tsoptions" }
tsrs_checker = { path = "crates/tsrs_checker" }
tsrs_pseudochecker = { path = "crates/tsrs_pseudochecker" }
tsrs_modulespecifiers = { path = "crates/tsrs_modulespecifiers" }
tsrs_compiler = { path = "crates/tsrs_compiler" }
tsrs_printer = { path = "crates/tsrs_printer" }
tsrs_transformers = { path = "crates/tsrs_transformers" }
tsrs_sourcemap = { path = "crates/tsrs_sourcemap" }
tsrs_declarations = { path = "crates/tsrs_declarations" }
tsrs_astnav = { path = "crates/tsrs_astnav" }
tsrs_lsproto = { path = "crates/tsrs_lsproto" }
tsrs_ls = { path = "crates/tsrs_ls" }
tsrs_project = { path = "crates/tsrs_project" }
tsrs_projectutil = { path = "crates/tsrs_projectutil" }
tsrs_lsp = { path = "crates/tsrs_lsp" }
tsrs_incremental = { path = "crates/tsrs_incremental" }
tsrs_api = { path = "crates/tsrs_api" }
tsrs_api_transport = { path = "crates/tsrs_api_transport" }
tsrs_api_codec = { path = "crates/tsrs_api_codec" }
tsrs_ipc = { path = "crates/tsrs_ipc" }
tsrs_contentmapper = { path = "crates/tsrs_contentmapper" }
tsrs_contentmappertest = { path = "crates/tsrs_contentmappertest" }

[profile.dev]
opt-level = 1
# Disabling debug info speeds up local and CI builds,
# and we don't rely on it for debugging that much.
debug = false
# `lto = false` still runs ThinLTO across a crate's codegen units when opt-level > 0; "off" skips it. That pass was
# most of an incremental rebuild of tsrs_checker (notes/dev-loop-build.md). `test` inherits this.
lto = "off"

[profile.test]
# Disabling debug info speeds up local and CI builds,
# and we don't rely on it for debugging that much.
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols" # set to `false` for debug information
debug = false # set to `true` for debug information
panic = "unwind"

# Release binaries (.github/workflows/release.yml) build with this profile twice, for PGO: -Cprofile-generate,
# training run, -Cprofile-use (notes/perf-pgo.md). `release` has the same LTO and codegen units; the release
# workflow's `dist` builds add only the PGO profile (and, on Linux, BOLT through .github/scripts/bolt.sh).
# Instrumented builds override rustc's LTO to thin, keeping this Cargo profile identical for PGO symbol matching.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The native reference of the WebAssembly gate in CI (tools/wasm/gate.sh): release code without LTO, which builds in
# about a third of the release build's time; the gate compares outputs, which LTO does not change.
[profile.ci-native]
inherits = "release"
lto = false
codegen-units = 16

# The edit-build-test loop (CONTRIBUTING.md, docs/DEBUGGING.md): release optimization without any LTO, incrementally.
# A checker edit rebuilds tsrs and tsrs-test in about 5 s instead of about 3 minutes, and the conformance suite gives
# the same results in the same time (notes/dev-loop-build.md). Not for performance measurements: use `release`.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true

# The WebAssembly module (crates/tsrs_wasm, tools/wasm/build.sh; notes/wasm-build.md has the opt-level measurements).
# panic = "abort": wasm cannot unwind (a panic prints and exits with status 5, as a panicked native driver thread).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

[workspace.lints.rust]
non_upper_case_globals = "allow"
non_camel_case_types = "allow"
# Rust 1.99: forming raw pointers through intermediate references can strengthen aliasing assumptions accidentally.
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
# Keep the baseline aligned with oxc-project/oxc. The documented Clippy command promotes these warnings to errors;
# project-specific performance, memory, threading and unsafe lints below are denied directly.
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Oxc's global allowlist: noisy, chaotic or unsuitable for a non-const compiler implementation.
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
non_std_lazy_statics = "allow"
result_large_err = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"
byte_char_slices = "allow"
question_mark = "allow"
multiple_crate_versions = "allow"

# Tsrs-specific exceptions to Oxc's policy. This workspace is an unpublished, mechanical Go port: visibility,
# signatures, numeric conversions, declaration placement and control-flow decomposition follow the Go source.
cargo_common_metadata = "allow"
redundant_pub_crate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
collapsible_if = "allow"
unused_self = "allow"
if_not_else = "allow"
needless_pass_by_ref_mut = "allow"
unnecessary_wraps = "allow"
needless_return = "allow"
identity_op = "allow"
single_match = "allow"
type_complexity = "allow"
too_long_first_doc_paragraph = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
single_match_else = "allow"
redundant_else = "allow"
needless_late_init = "allow"
unnecessary_unwrap = "allow"
collapsible_match = "allow"
if_same_then_else = "allow"
wrong_self_convention = "allow"
upper_case_acronyms = "allow"
module_inception = "allow"
enum_variant_names = "allow"
only_used_in_recursion = "allow"
self_only_used_in_recursion = "allow"
struct_field_names = "allow"
explicit_iter_loop = "allow"
option_option = "allow"
many_single_char_names = "allow"
float_cmp = "allow"
ref_option = "allow"
implicit_hasher = "allow"
return_self_not_must_use = "allow"
len_without_is_empty = "allow"
default_trait_access = "allow"

# Oxc restriction and nursery additions.
print_stdout = "allow" # Compiler and test-runner output is their interface.
print_stderr = "allow"
self_named_module_files = "allow" # One Rust file/module per Go file.
empty_drop = "warn"
empty_structs_with_brackets = "allow" # Mirrors Go's `struct{}` protocol types.
empty_enum_variants_with_brackets = "warn"
exit = "allow" # CLI entry points must preserve process exit statuses.
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
iter_on_single_items = "warn"
unused_peekable = "warn"
suspicious_operation_groupings = "warn"

# A `.clone()` that remains is a real copy.
redundant_clone = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
assigning_clones = "deny"
cloned_instead_of_copied = "deny"

# Allocations nobody asked for.
format_push_string = "deny"
inefficient_to_string = "deny"
needless_collect = "deny"
unnecessary_box_returns = "deny"
rc_buffer = "deny"
vec_box = "deny"
stable_sort_primitive = "deny"

# Argument passing and stack use.
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
inline_always = "deny"

# Hashing and iteration order (clippy.toml bans the SipHash std maps).
disallowed_types = "deny"
set_contains_or_insert = "deny"
zero_sized_map_values = "deny"
iter_over_hash_type = "deny"

# Locks and threads.
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
significant_drop_in_scrutinee = "deny"
non_send_fields_in_send_ty = "deny"

# `unsafe` (clippy.toml lists the unchecked operations that need a measured reason).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
as_ptr_cast_mut = "deny"
transmute_ptr_to_ptr = "deny"
mem_forget = "deny"
disallowed_methods = "deny"

# Leftovers and escape hatches. A suppression is `#[expect(lint, reason = "...")]`, never a bare `#[allow]`.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_macros = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

# The microsoft/TypeScript commit this port follows. Read by crates/tsrs_execute/build.rs (`tsrs --version`), by
# npm/build.mjs (npm version = "<workspace version>-ts<version>") and by CI (conformance testdata checkout).
[workspace.metadata.typescript]
version = "7.1.0-dev.20260929"
commit = "b85298b6a81f772d080b0455de0ca9d744cd6fd6"

[workspace.dependencies]
rustc-hash = "2"
indexmap = "2"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
bitflags = "2"
rayon = "1"
memchr = "2"
simdutf8 = "0.1.5"
dragonbox_ecma = "0.1.12"
mimalloc-safe = { version = "0.1.67", features = ["v3"] }
# Pin exactly: 1.1.2 uses Unicode 15.1.0, matching the pinned TypeScript identifier tables.
# Newer Unicode versions accept additional identifier characters; upgrade only when TypeScript's tables change.
unicode-id-start = "=1.1.2"
tsrs_core = { path = "crates/tsrs_core" }
tsrs_diagnostics = { path = "crates/tsrs_diagnostics" }
tsrs_spanmap = { path = "crates/tsrs_spanmap" }
tsrs_ast = { path = "crates/tsrs_ast" }
tsrs_scanner = { path = "crates/tsrs_scanner" }
tsrs_parser = { path = "crates/tsrs_parser" }
tsrs_binder = { path = "crates/tsrs_binder" }
tsrs_vfs = { path = "crates/tsrs_vfs" }
tsrs_module = { path = "crates/tsrs_module" }
tsrs_tsoptions = { path = "crates/tsrs_tsoptions" }
tsrs_checker = { path = "crates/tsrs_checker" }
tsrs_pseudochecker = { path = "crates/tsrs_pseudochecker" }
tsrs_modulespecifiers = { path = "crates/tsrs_modulespecifiers" }
tsrs_compiler = { path = "crates/tsrs_compiler" }
tsrs_printer = { path = "crates/tsrs_printer" }
tsrs_transformers = { path = "crates/tsrs_transformers" }
tsrs_sourcemap = { path = "crates/tsrs_sourcemap" }
tsrs_declarations = { path = "crates/tsrs_declarations" }
tsrs_astnav = { path = "crates/tsrs_astnav" }
tsrs_lsproto = { path = "crates/tsrs_lsproto" }
tsrs_ls = { path = "crates/tsrs_ls" }
tsrs_project = { path = "crates/tsrs_project" }
tsrs_projectutil = { path = "crates/tsrs_projectutil" }
tsrs_lsp = { path = "crates/tsrs_lsp" }
tsrs_incremental = { path = "crates/tsrs_incremental" }
tsrs_api = { path = "crates/tsrs_api" }
tsrs_api_transport = { path = "crates/tsrs_api_transport" }
tsrs_api_codec = { path = "crates/tsrs_api_codec" }
tsrs_ipc = { path = "crates/tsrs_ipc" }
tsrs_contentmapper = { path = "crates/tsrs_contentmapper" }
tsrs_contentmappertest = { path = "crates/tsrs_contentmappertest" }

[profile.dev]
opt-level = 1
# Disabling debug info speeds up local and CI builds,
# and we don't rely on it for debugging that much.
debug = false

[profile.test]
# Disabling debug info speeds up local and CI builds,
# and we don't rely on it for debugging that much.
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols" # set to `false` for debug information
debug = false # set to `true` for debug information
panic = "unwind"

# Release binaries (.github/workflows/release.yml) build with this profile twice, for PGO: -Cprofile-generate,
# training run, -Cprofile-use (notes/perf-pgo.md). `release` has the same LTO and codegen units; the release
# workflow's `dist` builds add only the PGO profile (and, on Linux, BOLT through .github/scripts/bolt.sh).
# Instrumented builds override rustc's LTO to thin, keeping this Cargo profile identical for PGO symbol matching.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The WebAssembly module (crates/tsrs_wasm, tools/wasm/build.sh; notes/wasm-build.md has the opt-level measurements).
# panic = "abort": wasm cannot unwind (a panic prints and exits with status 5, as a panicked native driver thread).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

[workspace.lints.rust]
# Specialized targets and the generated fourslash harness have target-specific unused items. Clippy denies
# dead_code explicitly for its workspace scope (docs/RUST.md).
dead_code = "allow"
non_upper_case_globals = "allow"
non_camel_case_types = "allow"
# Rust 1.99: forming raw pointers through intermediate references can strengthen aliasing assumptions accidentally.
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
# Clippy's style and complexity groups stay off: the port keeps the shape of the Go code (docs/PORTING.md). The
# lints below catch what a port gets wrong in Rust instead: copies and allocations Go does not make, unsound
# `unsafe`, and leftovers. Every enabled lint is denied; docs/RUST.md explains each group.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# A `.clone()` that remains is a real copy.
redundant_clone = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
assigning_clones = "deny"
cloned_instead_of_copied = "deny"

# Allocations nobody asked for.
format_push_string = "deny"
inefficient_to_string = "deny"
needless_collect = "deny"
unnecessary_box_returns = "deny"
rc_buffer = "deny"
vec_box = "deny"
stable_sort_primitive = "deny"

# Argument passing and stack use.
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
inline_always = "deny"

# Hashing and iteration order (clippy.toml bans the SipHash std maps).
disallowed_types = "deny"
set_contains_or_insert = "deny"
zero_sized_map_values = "deny"
iter_over_hash_type = "deny"

# Locks and threads.
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
significant_drop_in_scrutinee = "deny"
non_send_fields_in_send_ty = "deny"

# `unsafe` (clippy.toml lists the unchecked operations that need a measured reason).
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
as_ptr_cast_mut = "deny"
transmute_ptr_to_ptr = "deny"
mem_forget = "deny"
disallowed_methods = "deny"

# Leftovers and escape hatches. A suppression is `#[expect(lint, reason = "...")]`, never a bare `#[allow]`.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_macros = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
